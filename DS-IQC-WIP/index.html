<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f2538">
  <title>DS｜IQC 異常處理台</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#07121d;
      --panel:#0e2030;
      --panel2:#132b3e;
      --line:#27445a;
      --text:#eff7fb;
      --muted:#9eb4c3;
      --accent:#5bd4c7;
      --accent2:#73a9ff;
      --danger:#ff7d7d;
      --warn:#ffd166;
      --ok:#75df9b;
      --shadow:0 18px 48px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at top right,rgba(91,212,199,.12),transparent 32rem),
        linear-gradient(180deg,#081725,#06101a);
      color:var(--text);
      font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    }
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}
    .shell{width:min(1180px,100%);margin:auto;padding:18px}
    .topbar{
      display:flex;justify-content:space-between;gap:16px;align-items:center;
      padding:18px 20px;border:1px solid var(--line);border-radius:22px;
      background:rgba(14,32,48,.88);backdrop-filter:blur(18px);box-shadow:var(--shadow);
      position:sticky;top:10px;z-index:20;
    }
    .brand{display:flex;gap:12px;align-items:center}
    .logo{
      width:46px;height:46px;border-radius:15px;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06202a;
      font-weight:900;letter-spacing:.04em;
    }
    h1{font-size:1.2rem;margin:0}
    .subtitle{color:var(--muted);font-size:.86rem;margin-top:3px}
    .userbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .pill{
      display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
      border-radius:999px;padding:7px 11px;color:var(--muted);font-size:.82rem;
      background:rgba(255,255,255,.03)
    }
    .pill.ok{color:var(--ok);border-color:rgba(117,223,155,.35)}
    .pill.warn{color:var(--warn);border-color:rgba(255,209,102,.35)}
    .pill.danger{color:var(--danger);border-color:rgba(255,125,125,.35)}
    .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;margin-top:18px}
    .panel{
      border:1px solid var(--line);border-radius:22px;padding:20px;
      background:linear-gradient(180deg,rgba(19,43,62,.92),rgba(11,27,40,.92));
      box-shadow:var(--shadow);
    }
    .panel h2{margin:0 0 8px;font-size:1.05rem}
    .panel-note{margin:0 0 16px;color:var(--muted);font-size:.88rem;line-height:1.6}
    .field{margin-top:13px}
    label{display:block;font-size:.84rem;color:#c9d9e3;margin-bottom:6px;font-weight:700}
    input,select,textarea{
      width:100%;border:1px solid var(--line);border-radius:13px;
      background:#071825;color:var(--text);padding:12px 13px;outline:none;
    }
    textarea{min-height:94px;resize:vertical}
    input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,212,199,.12)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .btn{
      border:0;border-radius:13px;padding:11px 15px;font-weight:800;
      background:linear-gradient(135deg,var(--accent),#42b9d0);color:#06202a;
    }
    .btn.secondary{background:#19364b;color:var(--text);border:1px solid var(--line)}
    .btn.danger{background:#5b2530;color:#ffdfe4;border:1px solid #8b3f4e}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:18px}
    .login-card{
      width:min(440px,100%);padding:26px;border-radius:24px;border:1px solid var(--line);
      background:linear-gradient(180deg,#112a3d,#091925);box-shadow:var(--shadow)
    }
    .login-card .logo{width:58px;height:58px;margin-bottom:18px}
    .login-card h1{font-size:1.45rem}
    .check{display:flex;align-items:center;gap:8px;margin-top:13px;color:var(--muted);font-size:.86rem}
    .check input{width:auto}
    .toast{
      position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
      padding:12px 16px;border-radius:14px;background:#173349;border:1px solid var(--line);
      box-shadow:var(--shadow);z-index:100;max-width:min(560px,90vw);text-align:center
    }
    .toast.error{background:#4a2028;border-color:#8e3d4c}
    .result{
      margin-top:16px;border:1px solid var(--line);border-radius:16px;padding:14px;
      background:rgba(5,18,29,.72)
    }
    .result-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
    .metric{padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}
    .metric .k{font-size:.76rem;color:var(--muted)}
    .metric .v{font-size:1.15rem;font-weight:900;margin-top:4px}
    details{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
    summary{cursor:pointer;font-weight:800}
    pre{white-space:pre-wrap;word-break:break-word;color:#cfe1ec;font-size:.78rem;line-height:1.55}
    .request-list{display:grid;gap:10px;margin-top:14px}
    .request-card{border:1px solid var(--line);border-radius:15px;padding:14px;background:rgba(4,18,29,.62)}
    .request-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .request-id{font-weight:900;word-break:break-all}
    .request-meta{color:var(--muted);font-size:.8rem;margin-top:5px;line-height:1.55}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
    .tab{border:1px solid var(--line);background:#10283a;color:var(--muted);padding:9px 12px;border-radius:999px}
    .tab.active{color:#06202a;background:var(--accent);border-color:transparent;font-weight:900}
    .section{margin-top:18px}
    .danger-box{border:1px solid rgba(255,125,125,.42);background:rgba(110,31,45,.24);border-radius:14px;padding:12px;color:#ffd5db}
    .empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:14px}
    @media(max-width:860px){
      .grid{grid-template-columns:1fr}
      .topbar{position:static;align-items:flex-start}
      .userbar{justify-content:flex-start}
    }
    @media(max-width:560px){
      .shell{padding:10px}
      .topbar,.panel{border-radius:17px;padding:15px}
      .topbar{display:block}
      .userbar{margin-top:12px}
      .row,.metric-grid{grid-template-columns:1fr}
      .btn{width:100%}
    }
  </style>
</head>
<body>
  <section id="loginView" class="login-wrap">
    <div class="login-card">
      <div class="logo">IQC</div>
      <h1>IQC 異常處理台</h1>
      <p class="panel-note">查詢、提報、核准與稽核。正式 IQC_Log 在此版本維持唯讀。</p>
      <form id="loginForm">
        <div class="field">
          <label for="loginUser">帳號</label>
          <input id="loginUser" autocomplete="username" maxlength="40" required>
        </div>
        <div class="field">
          <label for="loginPin">PIN</label>
          <input id="loginPin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" required>
        </div>
        <label class="check"><input id="rememberLogin" type="checkbox">記住此裝置登入</label>
        <div class="actions"><button class="btn" type="submit">安全登入</button></div>
      </form>
    </div>
  </section>

  <main id="appView" class="shell hidden">
    <header class="topbar">
      <div class="brand">
        <div class="logo">IQC</div>
        <div>
          <h1>DS｜IQC 異常處理台</h1>
          <div class="subtitle">原始帳本唯讀・修正提報有跡可循</div>
        </div>
      </div>
      <div class="userbar">
        <span id="versionPill" class="pill"></span>
        <span id="userPill" class="pill ok"></span>
        <button id="logoutBtn" class="btn secondary" type="button">登出</button>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="workbench">查詢與提報</button>
      <button class="tab" data-tab="requests">異常單</button>
      <button id="reviewTabBtn" class="tab hidden" data-tab="review">主管審核</button>
    </div>

    <section id="tab-workbench" class="section">
      <div class="grid">
        <article class="panel">
          <h2>資料查詢</h2>
          <p class="panel-note">可查 CTN、submission_id 或異常單號；同時比對 IQC_Log、CTN Current State 與 Grinding WIP。</p>
          <div class="field">
            <label for="lookupQuery">查詢關鍵字</label>
            <input id="lookupQuery" placeholder="掃描 CTN 或輸入 submission_id">
          </div>
          <div class="actions">
            <button id="lookupBtn" class="btn" type="button">查詢目前狀態</button>
            <button id="clearLookupBtn" class="btn secondary" type="button">清除</button>
          </div>
          <div id="lookupResult"></div>
        </article>

        <article class="panel">
          <h2>提出異常修正</h2>
          <p class="panel-note">送出後建立永久異常單；不會直接改動正式 IQC_Log。</p>
          <div class="field">
            <label for="requestType">異常類型</label>
            <select id="requestType"></select>
          </div>
          <div class="field">
            <label for="targetCtn">主要 CTN</label>
            <input id="targetCtn" maxlength="7" placeholder="鋼瓶、集束或運輸框 CTN">
          </div>
          <div class="row">
            <div class="field">
              <label for="sourceFrameCtn">原運輸框</label>
              <input id="sourceFrameCtn" maxlength="7">
            </div>
            <div class="field">
              <label for="destinationFrameCtn">新運輸框</label>
              <input id="destinationFrameCtn" maxlength="7">
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label for="oldValue">修改前資料</label>
              <input id="oldValue" placeholder="例：RT123456 或錯誤 CTN">
            </div>
            <div class="field">
              <label for="newValue">建議正確資料</label>
              <input id="newValue" placeholder="例：123456 或正確 CTN">
            </div>
          </div>
          <div class="field">
            <label for="requestReason">異常原因</label>
            <textarea id="requestReason" placeholder="請說明現場發生什麼、要修正什麼"></textarea>
          </div>
          <div class="field">
            <label for="evidenceUrl">佐證連結（選填）</label>
            <input id="evidenceUrl" type="url" placeholder="照片或文件連結">
          </div>
          <div class="actions">
            <button id="submitRequestBtn" class="btn" type="button">建立異常單</button>
          </div>
          <div id="requestReceipt"></div>
        </article>
      </div>
    </section>

    <section id="tab-requests" class="section hidden">
      <article class="panel">
        <div class="result-head">
          <div>
            <h2>我的異常單</h2>
            <p class="panel-note">可追蹤待審核、核准、駁回與結案狀態。</p>
          </div>
          <button id="refreshRequestsBtn" class="btn secondary" type="button">更新</button>
        </div>
        <div id="myRequestList" class="request-list"></div>
      </article>
    </section>

    <section id="tab-review" class="section hidden">
      <article class="panel">
        <div class="result-head">
          <div>
            <h2>主管審核佇列</h2>
            <p class="panel-note">高風險資料需先確認 Grinding／DCYL／HT 狀態；核准仍不會自動改 IQC_Log。</p>
          </div>
          <button id="refreshReviewBtn" class="btn secondary" type="button">更新</button>
        </div>
        <div id="reviewList" class="request-list"></div>
      </article>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="./api_IQC_Correction_v01_20260806.js"></script>
  <script>
    "use strict";
    const Api = window.IqcCorrectionApi;
    const state = { user:null, bootstrap:null, lookup:null };

    const $ = id => document.getElementById(id);

    function toast(message,error){
      const el=$("toast");
      el.textContent=message;
      el.className="toast"+(error?" error":"");
      el.classList.remove("hidden");
      clearTimeout(toast.timer);
      toast.timer=setTimeout(()=>el.classList.add("hidden"),3600);
    }

    function normalizeCtn(value){
      return String(value||"").trim().toUpperCase().replace(/\s+/g,"");
    }

    function escapeHtml(value){
      return String(value??"").replace(/[&<>"']/g,ch=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[ch]));
    }

    async function login(userId,pin,remember){
      const result=await Api.post("login",{user_id:userId,pin});
      Api.saveToken(result.sessionToken,remember);
      state.user=result.user;
      await bootstrap();
      showApp();
    }

    async function bootstrap(){
      const result=await Api.post("bootstrap",{});
      state.bootstrap=result;
      state.user=result.user;
      $("versionPill").textContent=result.version;
      $("userPill").textContent=`${result.user.displayName}｜${result.user.role}`;
      $("reviewTabBtn").classList.toggle("hidden",!result.permissions.canReview);
      $("requestType").innerHTML=result.requestTypes.map(item=>
        `<option value="${escapeHtml(item.code)}">${escapeHtml(item.label)}</option>`
      ).join("");
    }

    function showApp(){
      $("loginView").classList.add("hidden");
      $("appView").classList.remove("hidden");
    }

    function showLogin(){
      $("appView").classList.add("hidden");
      $("loginView").classList.remove("hidden");
    }

    async function tryRestore(){
      if(!Api.hasToken()) return;
      try{
        await bootstrap();
        showApp();
      }catch(err){
        Api.clearToken();
        showLogin();
      }
    }

    async function lookup(){
      const query=$("lookupQuery").value.trim();
      if(!query) return toast("請輸入查詢關鍵字",true);
      $("lookupBtn").disabled=true;
      try{
        const response=await Api.post("lookup",{query});
        state.lookup=response.result;
        renderLookup(response.result);
        if(response.result.queryType==="CTN") $("targetCtn").value=response.result.normalizedQuery;
      }catch(err){
        toast(err.message,true);
      }finally{
        $("lookupBtn").disabled=false;
      }
    }

    function renderLookup(result){
      const iqcCount=
        result.iqc.bundleCards.length+
        result.iqc.transportCards.length+
        result.iqc.bottleRows.length+
        result.iqc.submissionRows.length;
      const riskClass=result.risk.level==="HIGH"?"danger":"ok";
      const riskText=result.risk.downstreamLocked
        ?"已進後續製程｜主管審核"
        :(result.risk.reasons.length?"需人工確認":"一般審核");

      const reasons=result.risk.reasons.length
        ? `<div class="danger-box">${result.risk.reasons.map(escapeHtml).join("<br>")}</div>`
        :"";

      $("lookupResult").innerHTML=`
        <div class="result">
          <div class="result-head">
            <strong>${escapeHtml(result.normalizedQuery)}</strong>
            <span class="pill ${riskClass}">${escapeHtml(riskText)}</span>
          </div>
          <div class="metric-grid">
            <div class="metric"><div class="k">IQC 來源</div><div class="v">${iqcCount}</div></div>
            <div class="metric"><div class="k">Grinding 狀態</div><div class="v">${result.grinding.length}</div></div>
            <div class="metric"><div class="k">相關異常單</div><div class="v">${result.relatedRequests.length}</div></div>
          </div>
          ${reasons}
          <details>
            <summary>查看完整查詢快照</summary>
            <pre>${escapeHtml(JSON.stringify(result,null,2))}</pre>
          </details>
        </div>`;
    }

    async function createRequest(){
      const requestType=$("requestType").value;
      const targetCtn=normalizeCtn($("targetCtn").value);
      const sourceFrameCtn=normalizeCtn($("sourceFrameCtn").value);
      const destinationFrameCtn=normalizeCtn($("destinationFrameCtn").value);
      const reason=$("requestReason").value.trim();
      if(!reason) return toast("請填寫異常原因",true);

      $("submitRequestBtn").disabled=true;
      try{
        const response=await Api.post("create_request",{
          idempotency_key:Api.makeIdempotencyKey("IQCR"),
          request_type:requestType,
          target_ctn:targetCtn,
          source_frame_ctn:sourceFrameCtn,
          destination_frame_ctn:destinationFrameCtn,
          old_value:{value:$("oldValue").value.trim()},
          proposed_value:{value:$("newValue").value.trim()},
          reason,
          evidence_url:$("evidenceUrl").value.trim()
        });
        const request=response.request;
        $("requestReceipt").innerHTML=`
          <div class="result">
            <div class="result-head">
              <strong>${escapeHtml(request.requestId)}</strong>
              <span class="pill warn">${escapeHtml(request.status)}</span>
            </div>
            <p class="panel-note">${escapeHtml(response.message)}</p>
            <div class="metric-grid">
              <div class="metric"><div class="k">類型</div><div class="v" style="font-size:.94rem">${escapeHtml(request.requestTypeLabel)}</div></div>
              <div class="metric"><div class="k">風險</div><div class="v">${escapeHtml(request.riskLevel)}</div></div>
              <div class="metric"><div class="k">建立時間</div><div class="v" style="font-size:.82rem">${escapeHtml(request.createdAt)}</div></div>
            </div>
          </div>`;
        toast("異常單建立成功");
        await loadMyRequests();
      }catch(err){
        toast(err.message,true);
      }finally{
        $("submitRequestBtn").disabled=false;
      }
    }

    function requestCard(request,reviewMode){
      const statusClass=request.status==="PENDING_REVIEW"?"warn":
        request.status==="REJECTED"?"danger":"ok";
      const riskClass=request.riskLevel==="HIGH"?"danger":"warn";
      let buttons="";
      if(reviewMode&&request.status==="PENDING_REVIEW"){
        buttons=`<div class="actions">
          <button class="btn" onclick="reviewRequest('${escapeHtml(request.requestId)}','APPROVE')">核准</button>
          <button class="btn danger" onclick="reviewRequest('${escapeHtml(request.requestId)}','REJECT')">駁回</button>
        </div>`;
      }else if(reviewMode&&["APPROVED","REJECTED"].includes(request.status)){
        buttons=`<div class="actions">
          <button class="btn secondary" onclick="closeRequest('${escapeHtml(request.requestId)}')">完成結案</button>
        </div>`;
      }
      return `
        <article class="request-card">
          <div class="request-top">
            <div>
              <div class="request-id">${escapeHtml(request.requestId)}</div>
              <div class="request-meta">
                ${escapeHtml(request.requestTypeLabel)}｜${escapeHtml(request.requesterName)}｜${escapeHtml(request.createdAt)}
              </div>
            </div>
            <div>
              <span class="pill ${statusClass}">${escapeHtml(request.status)}</span>
              <span class="pill ${riskClass}">${escapeHtml(request.riskLevel)}</span>
            </div>
          </div>
          <div class="request-meta">
            主要 CTN：${escapeHtml(request.targetCtn||"-")}｜
            原框：${escapeHtml(request.sourceFrameCtn||"-")}｜
            新框：${escapeHtml(request.destinationFrameCtn||"-")}<br>
            原因：${escapeHtml(request.reason)}
          </div>
          ${request.reviewNote?`<div class="request-meta">審核：${escapeHtml(request.reviewNote)}</div>`:""}
          ${buttons}
          <details><summary>查看資料快照</summary><pre>${escapeHtml(JSON.stringify(request.sourceSnapshot,null,2))}</pre></details>
        </article>`;
    }

    async function loadMyRequests(){
      try{
        const response=await Api.post("list_requests",{limit:100});
        $("myRequestList").innerHTML=response.requests.length
          ?response.requests.map(r=>requestCard(r,false)).join("")
          :'<div class="empty">目前沒有異常單。</div>';
      }catch(err){toast(err.message,true)}
    }

    async function loadReview(){
      try{
        const response=await Api.post("list_requests",{limit:200});
        $("reviewList").innerHTML=response.requests.length
          ?response.requests.map(r=>requestCard(r,true)).join("")
          :'<div class="empty">目前沒有異常單。</div>';
      }catch(err){toast(err.message,true)}
    }

    window.reviewRequest=async function(requestId,decision){
      const verb=decision==="APPROVE"?"核准":"駁回";
      const note=prompt(`請輸入${verb}說明：`);
      if(!note) return;
      try{
        const response=await Api.post("review_request",{
          request_id:requestId,decision,review_note:note
        });
        toast(response.message);
        await loadReview();
        await loadMyRequests();
      }catch(err){toast(err.message,true)}
    };

    window.closeRequest=async function(requestId){
      const note=prompt("請輸入結案說明（例如：已由管理者完成資料校正／確認無需修改）：");
      if(!note) return;
      try{
        const response=await Api.post("close_request",{
          request_id:requestId,
          close_note:note
        });
        toast(response.message);
        await loadReview();
        await loadMyRequests();
      }catch(err){toast(err.message,true)}
    };

    function switchTab(tab){
      document.querySelectorAll(".tab").forEach(btn=>
        btn.classList.toggle("active",btn.dataset.tab===tab)
      );
      ["workbench","requests","review"].forEach(name=>
        $("tab-"+name).classList.toggle("hidden",name!==tab)
      );
      if(tab==="requests") loadMyRequests();
      if(tab==="review") loadReview();
    }

    $("loginForm").addEventListener("submit",async event=>{
      event.preventDefault();
      try{
        await login(
          $("loginUser").value.trim(),
          $("loginPin").value.trim(),
          $("rememberLogin").checked
        );
      }catch(err){toast(err.message,true)}
    });
    $("logoutBtn").addEventListener("click",()=>{
      Api.clearToken();state.user=null;showLogin()
    });
    $("lookupBtn").addEventListener("click",lookup);
    $("clearLookupBtn").addEventListener("click",()=>{
      $("lookupQuery").value="";$("lookupResult").innerHTML="";state.lookup=null
    });
    $("lookupQuery").addEventListener("input",event=>{
      event.target.value=event.target.value.toUpperCase()
    });
    $("lookupQuery").addEventListener("keydown",event=>{
      if(event.key==="Enter"){event.preventDefault();lookup()}
    });
    ["targetCtn","sourceFrameCtn","destinationFrameCtn"].forEach(id=>{
      $(id).addEventListener("input",event=>event.target.value=normalizeCtn(event.target.value))
    });
    $("submitRequestBtn").addEventListener("click",createRequest);
    $("refreshRequestsBtn").addEventListener("click",loadMyRequests);
    $("refreshReviewBtn").addEventListener("click",loadReview);
    document.querySelectorAll(".tab").forEach(btn=>
      btn.addEventListener("click",()=>switchTab(btn.dataset.tab))
    );

    tryRestore();
  </script>
</body>
</html>

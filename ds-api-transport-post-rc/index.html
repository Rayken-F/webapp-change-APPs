<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101942">
  <title>DS POST Transport Diagnostic RC</title>
  <style>
    :root{color-scheme:dark;--line:rgba(190,205,255,.18);--muted:#aebde8;--ok:#71ddb0;--bad:#ff8298}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(160deg,#07112b,#14245f 52%,#281066);color:#fff}
    body{padding:calc(env(safe-area-inset-top,0px) + 22px) 14px calc(env(safe-area-inset-bottom,0px) + 28px)}
    .wrap{width:min(820px,100%);margin:auto}.head small{color:#9fb4f1;font-weight:800}.head h1{margin:6px 0 8px;font-size:25px}.head p{margin:0;color:var(--muted);line-height:1.6}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}.actions button{min-height:49px;border:1px solid rgba(142,159,255,.28);border-radius:15px;background:linear-gradient(135deg,#685cff,#4c44d8);color:#fff;font-weight:900;font-size:14px}.actions button.secondary{background:rgba(255,255,255,.08)}.actions button:disabled{opacity:.45}
    .summary,.card{border:1px solid var(--line);border-radius:18px;background:rgba(18,29,78,.88);padding:14px;margin-bottom:11px}.summary{color:var(--muted)}.summary strong{color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.card h2{margin:0 0 10px;font-size:17px}.row{padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);font-size:11px;line-height:1.45;margin-top:7px}.row.bad{border-color:rgba(255,130,152,.42)}.top{display:flex;justify-content:space-between;gap:8px}.meta{margin-top:4px;color:#aab8df;overflow-wrap:anywhere}.prefix{margin-top:6px;padding:7px;border-radius:9px;background:rgba(0,0,0,.18);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}.badge{font-weight:900}.ok{color:var(--ok)}.bad{color:var(--bad)}
    @media(max-width:680px){.actions,.grid{grid-template-columns:1fr}.head h1{font-size:22px}}
  </style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <small>DS P0 POST TRANSPORT · RC</small>
    <h1>IQC / Grinding POST 路徑檢測</h1>
    <p>使用與正式送出相同的 POST + text/plain + JSON body 傳輸方式，但只呼叫唯讀檢查 API，不新增 IQC、不修改 WIP、不建立正式交易。</p>
  </header>
  <div class="actions"><button id="runBtn">POST 連續 5 輪</button><button id="copyBtn" class="secondary">複製診斷摘要</button></div>
  <div id="summary" class="summary">尚未執行。</div>
  <section class="grid"><article class="card"><h2>日報 / IQC POST</h2><div id="dailyLog"></div></article><article class="card"><h2>Grinding POST</h2><div id="grindLog"></div></article></section>
</main>
<script src="../ds-report-pwa/api.js"></script>
<script src="../ds-report-pwa-beta/api.js"></script>
<script>
(function(){
  "use strict";
  const VERSION="DS_API_POST_TRANSPORT_DIAG_RC_V1_20260819";
  const state={runId:"",rows:[],running:false};
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  function hostOf(url){try{return new URL(url).hostname||""}catch(_){return ""}}
  function safePrefix(text){let s=String(text||"").replace(/\s+/g," ").trim().slice(0,180);return s.replace(/([?&](?:token|session_token|api_key|diag_token)=)[^&\s]+/ig,"$1[REDACTED]");}
  function classify(text,type,status,error){if(error)return error.name==="AbortError"?"TIMEOUT":"NETWORK_ERROR";if(!text||!text.trim())return"EMPTY";const x=text.trim().slice(0,220).toLowerCase();if(x.startsWith("<!doctype html")||x.startsWith("<html")||String(type||"").toLowerCase().includes("text/html"))return"HTML";try{JSON.parse(text);return status>=200&&status<300?"JSON_OK":"JSON_HTTP_ERROR"}catch(_){return"INVALID_JSON"}}
  function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
  async function probe(system,label,url,body,round,timeout){
    const started=performance.now();const controller=typeof AbortController==="function"?new AbortController():null;const timer=controller?setTimeout(()=>controller.abort(),timeout||20000):0;let res=null,text="",error=null;
    try{res=await fetch(url,{method:"POST",cache:"no-store",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),signal:controller?controller.signal:undefined});text=await res.text();}catch(e){error=e}finally{if(timer)clearTimeout(timer)}
    const status=res?Number(res.status||0):0;const type=res?String(res.headers.get("content-type")||""):"";const cls=classify(text,type,status,error);let payloadOk="";if(cls==="JSON_OK"||cls==="JSON_HTTP_ERROR"){try{const j=JSON.parse(text);payloadOk=typeof j.ok==="boolean"?String(j.ok):"n/a"}catch(_){}}
    return {system,label,round,time:new Date().toISOString(),status,type,bytes:new Blob([text]).size,classification:cls,payloadOk,elapsedMs:Math.round(performance.now()-started),redirected:!!(res&&res.redirected),host:res?hostOf(res.url):"",prefix:!["JSON_OK","JSON_HTTP_ERROR"].includes(cls)?safePrefix(text):"",error:error?String(error.message||error):""};
  }
  function render(){for(const system of ["daily","grinding"]){const target=document.getElementById(system==="daily"?"dailyLog":"grindLog");const rows=state.rows.filter(r=>r.system===system);target.innerHTML=rows.slice().reverse().map(r=>`<div class="row ${!["JSON_OK","JSON_HTTP_ERROR"].includes(r.classification)?"bad":""}"><div class="top"><strong>R${r.round} · ${esc(r.label)}</strong><span class="badge ${r.classification==="JSON_OK"?"ok":"bad"}">${esc(r.classification)}</span></div><div class="meta">HTTP=${r.status||0}｜type=${esc(r.type||"-")}｜bytes=${r.bytes}｜${r.elapsedMs}ms｜redirect=${r.redirected}｜host=${esc(r.host||"-")}｜payload.ok=${esc(r.payloadOk||"-")}</div>${r.prefix?`<div class="prefix">${esc(r.prefix)}</div>`:""}${r.error?`<div class="prefix">ERROR: ${esc(r.error)}</div>`:""}</div>`).join("")}}
    const bad=state.rows.filter(r=>!["JSON_OK","JSON_HTTP_ERROR"].includes(r.classification));document.getElementById("summary").innerHTML=state.running?`檢測中… <strong>${state.rows.length}</strong> 筆完成`:(state.rows.length?(bad.length?`抓到 <strong>${bad.length}</strong> 筆 POST 傳輸異常。請複製摘要。`:`本次 <strong>${state.rows.length}</strong> 筆 POST 全部收到可解析 JSON。`):"尚未執行。");}
  async function run(){if(state.running)return;state.running=true;state.rows=[];state.runId="POSTDIAG_"+Date.now()+"_"+Math.random().toString(36).slice(2,7).toUpperCase();document.getElementById("runBtn").disabled=true;render();
    try{for(let round=1;round<=5;round++){
      state.rows.push(await probe("daily","IQC CTN Check",API_URL+"?api=iqc_ctn_check&diag_nonce="+Date.now(),{date:today(),entries:[],transportLoads:[],ctnList:[]},round,22000));render();await sleep(250);
      state.rows.push(await probe("grinding","WIP Lookup Batch",BETA_API_URL,{api:"wip_lookup_batch",token:BETA_API_TOKEN,client_version:BETA_CLIENT_VERSION,ctns:[]},round,22000));render();if(round<5)await sleep(500);
    }}finally{state.running=false;document.getElementById("runBtn").disabled=false;render();}}
  function copy(){if(!state.rows.length){alert("請先執行檢測");return}const head=`version=${VERSION} | run_id=${state.runId} | time=${new Date().toISOString()} | online=${navigator.onLine} | visibility=${document.visibilityState} | ua=${navigator.userAgent}`;const lines=state.rows.map(r=>`${r.system}/${r.label} | R${r.round} | ${r.time} | HTTP=${r.status||0} | type=${r.type||"-"} | bytes=${r.bytes} | ${r.classification} | payload.ok=${r.payloadOk||"-"} | ${r.elapsedMs}ms | redirected=${r.redirected} | host=${r.host||"-"} | prefix=${r.prefix||"-"} | error=${r.error||"-"}`);const text=[head,...lines].join("\n");navigator.clipboard.writeText(text).then(()=>alert("診斷摘要已複製")).catch(()=>prompt("請複製以下內容",text));}
  document.getElementById("runBtn").addEventListener("click",run);document.getElementById("copyBtn").addEventListener("click",copy);
})();
</script>
</body>
</html>

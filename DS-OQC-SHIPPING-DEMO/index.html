<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101942"><title>庫存掃描｜DEMO V0.2.3</title><style>:root{color-scheme:dark;--line:#536398;--muted:#b4c1df;--cyan:#67dce8;--red:#ff777f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;color:#f4f6ff;background:#121b45}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#102440,#29175a);min-height:100dvh}button,input,textarea,select{font:inherit}button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}button{border:1px solid var(--line);background:#303d78;color:inherit;border-radius:13px;min-height:44px;padding:10px 12px;font-size:14px;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:default}.primary,.modeNav .active{background:#6656f6;border-color:transparent}.hidden{display:none!important}header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:#09132ef5;border-bottom:1px solid var(--line)}header a{color:inherit;text-decoration:none;font-size:34px;width:36px;text-align:center}header small{color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:.15em}h1{font-size:21px;margin:3px 0 0}h2{font-size:17px;margin:0 0 12px}.pill{margin-left:auto;border:1px solid #a88b4a;color:#ffd482;border-radius:20px;padding:5px 8px;font-size:10px;white-space:nowrap}main{max-width:840px;margin:auto;padding:12px 12px calc(95px + env(safe-area-inset-bottom,0px))}.notice{border:1px solid #b39753;background:#302c35;border-radius:13px;padding:10px 12px;font-size:12px;line-height:1.5;margin-bottom:12px}.panel{background:#14234fdb;border:1px solid var(--line);border-radius:19px;padding:13px;margin-bottom:12px}.batch-picker,.row,#scanForm,.modeNav{display:flex;gap:8px;align-items:center}.modeNav button{flex:1}.batch-picker select{flex:1;min-width:0}.batch-picker button{flex-shrink:0}input,textarea,select{border:1px solid #536990;background:#07192c;color:inherit;border-radius:12px;padding:10px;width:100%;font-size:16px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #67dce81a}#scanForm{margin:12px 0}#scanInput{min-width:0;font-size:20px;letter-spacing:.05em;text-transform:uppercase;height:52px}#scanBtn{white-space:nowrap;height:52px}.subtext{color:var(--muted);font-size:12px;line-height:1.55;margin:8px 0;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;font-size:11px;color:var(--muted);margin:10px 0}.stats span{padding:8px 4px;text-align:center;border-radius:10px;background:#08182eaa}.stats b{color:#fff;display:block;font-size:20px;margin-top:2px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.edit-panel{margin-top:12px;border:1px solid #56c9db;border-radius:14px;padding:11px}.edit-panel .row{margin-bottom:8px}.edit-panel .row:last-child{margin-bottom:0}#rtCancel{margin-left:auto}#selectionCount{color:var(--muted);font-size:12px}.group{padding:11px;border:1px solid #516aa0;border-radius:17px;background:#15214fe8;margin:10px 0}.group-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.group-head b{font-size:18px}.group-head small{font-size:12px;color:var(--muted)}.swipe{position:relative;overflow:hidden;touch-action:pan-y;border-radius:13px;margin:7px 0;background:#c34554}.delete{position:absolute;right:0;top:0;bottom:0;width:88px;background:#c34554;border:0;border-radius:0}.item{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:3px 6px;padding:10px 8px;border:1px solid #445784;border-radius:13px;background:#13224c;transition:transform .16s ease;min-height:58px}.number{grid-row:1/4;align-self:center;font-size:12px;color:#c7c8ff;background:#393b80;border-radius:8px;padding:5px 0;text-align:center}.pick{grid-column:1;grid-row:1/4;width:22px;height:24px;margin:0;align-self:center}.mainline{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;grid-column:2}.ctn{font-size:17px;font-weight:800;white-space:nowrap}.status{font-size:13px;font-weight:650;color:#b9c8e5}.rtline{grid-row:2;grid-column:2/-1;font-size:13px;font-weight:650;color:#ccd7ef;line-height:1.35}.type{grid-column:2/-1;grid-row:3;color:var(--muted);font-size:11px}.arrow{color:var(--cyan)}.newrt{color:#88e6c3}.flag{grid-row:1;grid-column:3;text-align:right;font-size:12px;white-space:nowrap;color:#7be2ba;font-weight:700}.flag small{display:block;color:var(--muted);font-weight:400;font-size:10px;margin-top:3px}.danger{color:var(--red)!important}.warning{color:#ffd078!important}.empty{padding:25px 12px;text-align:center;color:var(--muted);font-size:14px}details summary{font-size:15px;font-weight:700;cursor:pointer}.tools{padding-top:12px}.tools .row{flex-wrap:wrap;margin:8px 0}.tools .row button{flex:1}.check{display:flex;align-items:center;gap:8px;font-size:13px;margin:13px 0}.check input{width:22px;height:22px;margin:0}dialog{width:min(92%,480px);max-height:85dvh;overflow:auto;color:#fff;background:#14213a;border:1px solid var(--line);border-radius:18px;padding:18px}dialog::backdrop{background:#000b}dialog label{display:block;color:var(--muted);font-size:12px;margin:12px 0}dialog label input,dialog label textarea{display:block;margin-top:6px}dialog .row{justify-content:flex-end;margin-top:12px}#closeSummary,#receiptText{font-size:13px;line-height:1.8;overflow-wrap:anywhere}#toast,#undo{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(92%,680px);z-index:50;background:#08172d;border:1px solid var(--line);border-radius:15px;padding:13px;font-size:14px;box-shadow:0 10px 35px #0007}#undo{display:flex;align-items:center;justify-content:space-between;border-color:#b49859}#undo button{background:#e9c66e;color:#15213d}#receiptPanel button{margin-top:12px}@media(max-width:360px){.item{grid-template-columns:22px minmax(0,1fr) auto;column-gap:4px}.ctn{font-size:16px}.status{font-size:12px}.flag{font-size:11px}.pill{font-size:9px}.stats{font-size:10px}button{font-size:13px;padding:9px}main{padding-left:8px;padding-right:8px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<header><a href="../ds-app/" aria-label="返回 DS 工作台">‹</a><div><small>OQC INVENTORY</small><h1>庫存掃描</h1></div><span class="pill" id="version">DEMO V0.2.3</span></header><main>
<div class="notice" id="environment">正在核對 0.2.3 DEMO 後端。此頁非正式上線。</div>
<details class="panel" id="realConnection" open><summary>連接實際 CTN 驗收</summary><div class="tools"><input id="endpoint" type="url" placeholder="原 OQC DEMO /exec 網址" aria-label="DEMO 後端網址"><div class="row"><button id="connect">連接實際驗收</button></div><p class="subtext">前後端都必須更新到 0.2.3。沿用原 DEMO 專案、網址、資料與 DS 登入。</p></div></details>
<section class="panel hidden" id="recovery"><h2>取回先前的有效 CTN</h2><p class="subtext" id="recoveryInfo"></p><button id="recoverBtn">帶入實連查詢</button><p class="subtext">只帶 CTN 與原掃描時間，不帶模擬 RT／收據；原資料及作廢紀錄保留。</p></section>
<section class="panel"><div class="modeNav"><button id="packMode" class="active">裝框紀錄</button><button id="queryMode">僅查詢</button></div><p class="subtext" id="modeHint"></p>
<div id="packOnly"><div class="batch-picker"><select id="batchSelect" aria-label="裝框批次"></select><button id="newBatch">＋新批次</button></div><p id="batchMeta" class="subtext"></p><div class="stats"><span>已收錄 <b id="total">0</b></span><span>未建IQC <b id="missing">0</b></span><span>待查 <b id="pending">0</b></span><span>待傳 <b id="outbox">0</b></span></div><p class="subtext" id="unitSummary"></p></div>
<form id="scanForm" autocomplete="off"><input id="scanInput" placeholder="掃描 CTN" aria-label="CTN" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="40"><button id="scanBtn" class="primary">掃描加入</button></form>
<div id="packActions" class="actions"><button id="settingsBtn">設定總量／備註</button><button id="rtBtn">RT 更改</button><button id="syncBtn">同步／重試</button><button id="closeBtn" class="primary">完成裝框批次</button></div>
<div class="edit-panel hidden" id="rtPanel"><div class="row"><b>RT 更改</b><span id="selectionCount"></span><button id="rtCancel">×</button></div><div class="row"><button id="selectAll">全選</button><button id="selectNone">清除</button></div><div class="row"><input id="newRt" inputmode="numeric" maxlength="10" placeholder="輸入新 RT" aria-label="輸入新 RT"><button id="applyRt" class="primary">套用更改</button></div></div><div class="subtext" id="syncState" aria-live="polite"></div></section>
<div id="list"></div>
<section class="panel hidden" id="receiptPanel"><h2>完成確認</h2><div id="receiptText"></div><button id="checkReceipt">查詢原收據</button></section>
<details class="panel"><summary>DEMO 驗收工具</summary><div class="tools"><div class="row"><button id="retryIqc">重試待查 IQC</button><button id="refreshRemote">讀取後端</button><button id="export">匯出驗收紀錄</button></div><label class="check"><input type="checkbox" id="offline">模擬斷網</label><div id="simTools" class="hidden"><button id="samples">加入合成範例</button><label class="check"><input type="checkbox" id="lostReply">模擬已寫入但回應遺失</label></div></div></details>
</main>
<dialog id="settings"><form method="dialog"><h2>裝框資料</h2><label>裝框識別<input id="shippingRef" maxlength="80" placeholder="框號或本次作業識別"></label><label>作業日期<input id="workDate" type="date"></label><label>實際作業人員<input id="workers" maxlength="120" placeholder="填寫本次實際作業人員"></label><label>標籤總量（CTN 件數，可留空）<input id="target" type="number" inputmode="numeric" min="1" max="9999"></label><label>備註<textarea id="note" maxlength="120" rows="2"></textarea></label><div class="row"><button value="cancel">取消</button><button class="primary" id="saveSettings" type="button">儲存</button></div></form></dialog>
<dialog id="closeDialog"><h2>確認完成裝框</h2><div id="closeSummary"></div><p class="subtext">確認下列未建 IQC／待查項目與數量後，提交裝框完成。出貨狀態仍為未確認，不等於品質放行。</p><div class="row"><button id="cancelClose">取消</button><button id="confirmClose" class="primary">確認完成裝框</button></div></dialog>
<div id="toast" class="hidden" role="status"></div><div id="undo" class="hidden"><span id="undoText"></span><button id="undoBtn">復原</button></div>
<script>/* OQC shipping DEMO V0.2.0. Pure command reducer shared by browser and RC backend. */
(function(g){
  'use strict';
  const VERSION='OQC_SHIPPING_DEMO_V02_20260909';
  const clone=x=>JSON.parse(JSON.stringify(x));
  const norm=x=>String(x==null?'':x).trim().toUpperCase();
  const ctnPattern=/^[A-Z]{2}\d{2}[A-Z]{2}[A-Z0-9]$/;
  const rtPattern=/^\d{5,10}$/;
  const fail=(code,message)=>{const e=new Error(message);e.code=code;throw e;};
  function canonical(x){
    if(Array.isArray(x)) return '['+x.map(canonical).join(',')+']';
    if(x&&typeof x==='object') return '{'+Object.keys(x).sort().map(k=>JSON.stringify(k)+':'+canonical(x[k])).join(',')+'}';
    return JSON.stringify(x);
  }
  function active(doc){return (doc&&doc.items||[]).filter(i=>!i.voided);}
  // Compact non-secret UI snapshot checksum. Revision checks and server SHA-256
  // idempotency hashes remain authoritative; this is not an authentication primitive.
  function fingerprint(value){
    const s=canonical(value);let a=2166136261,b=2246822507;
    for(let n=0;n<s.length;n++){a=Math.imul(a^s.charCodeAt(n),16777619);b=Math.imul(b^s.charCodeAt(n),3266489909);}
    return 'view-'+(a>>>0).toString(16).padStart(8,'0')+(b>>>0).toString(16).padStart(8,'0');
  }
  function signature(doc){
    return fingerprint({ref:doc.shippingRef,target:doc.targetQty,items:active(doc).map(i=>({ctn:i.ctn,rt:i.rt,iqc:i.iqc.state,status:i.iqc.status,changes:i.rtChanges.map(c=>[c.oldRt,c.newRt,c.operationId])})).sort((a,b)=>a.ctn.localeCompare(b.ctn))});
  }
  function summary(doc){
    const items=active(doc);
    return {total:items.length,found:items.filter(i=>i.iqc.state==='FOUND').length,
      missing:items.filter(i=>i.iqc.state==='NOT_FOUND').length,
      pending:items.filter(i=>['PENDING','ERROR'].includes(i.iqc.state)).length,
      conflicts:items.filter(i=>['CONFLICT','NON_CYLINDER'].includes(i.iqc.state)).length,
      voided:(doc&&doc.items||[]).filter(i=>i.voided).length};
  }
  function groups(doc){
    const map=new Map();
    active(doc).forEach(i=>{
      const key=i.iqc.state==='FOUND'?'RT '+i.rt:i.iqc.state==='NOT_FOUND'?'未建IQC':'待確認';
      if(!map.has(key))map.set(key,[]);
      map.get(key).push(i);
    });
    return Array.from(map.entries()).map(([title,items])=>({title,items}));
  }
  function text(value,max,name){
    const s=String(value==null?'':value).trim();
    if(s.length>max)fail('FIELD_TOO_LONG',name+'過長');return s;
  }
  function run(input,command,context){
    const cmd=clone(command),ctx=context||{},p=cmd.data||{},when=ctx.time||cmd.at,actor=ctx.actor||'DEMO';
    if(!/^op_[a-z0-9_-]{8,100}$/i.test(cmd.id||'')||!/^b_[a-z0-9_-]{8,100}$/i.test(cmd.batchId||''))fail('INVALID_ID','操作編號不正確');
    if(!when||!Number.isFinite(Date.parse(when)))fail('INVALID_TIME','操作時間不正確');
    let doc=input?clone(input):null;
    if(doc&&doc.applied[cmd.id]){
      if(doc.applied[cmd.id]!==canonical(cmd))fail('IDEMPOTENCY_CONFLICT','同一操作編號的內容不同');
      return doc;
    }
    if(Number(cmd.base)!==Number(doc?doc.revision:0))fail('REVISION_CONFLICT','資料已在其他裝置更新；請先更新並檢查待送資料');
    if(cmd.type==='CREATE'){
      if(doc)fail('EXISTS','此批次已存在');
      doc={id:cmd.batchId,number:ctx.number||p.number||'',revision:0,phase:'OPEN',shippingRef:'',note:'',targetQty:null,
        createdAt:when,createdBy:actor,items:[],applied:{},history:[],receipt:null};
    }else{
      if(!doc)fail('NOT_FOUND','批次不存在');
      if(doc.phase!=='OPEN')fail('CLOSED','已完成的批次不能直接修改');
      switch(cmd.type){
        case 'SCAN':{
          const ctn=norm(p.ctn);
          if(!ctnPattern.test(ctn))fail('INVALID_CTN','CTN 格式錯誤，本次未收錄');
          let item=doc.items.find(i=>i.ctn===ctn);
          if(item&&!item.voided)fail('DUPLICATE_CTN','CTN 已在本批次，不重複計數');
          if(item){item.voided=false;item.voidId='';item.scannedAt=when;item.capturedAt=cmd.at;item.scanId=cmd.id;}
          else{
            if(doc.items.length>=500)fail('BATCH_LIMIT','DEMO 每批最多 500 支');
            item={ctn,scanId:cmd.id,scannedAt:when,capturedAt:cmd.at,scannedBy:actor,voided:false,voidId:'',rt:'',rtChanges:[],
              iqc:{state:'PENDING',rt:'',status:'',checkedAt:'',message:''}};
            doc.items.push(item);
          }break;
        }
        case 'IQC_RESULT':{
          const item=doc.items.find(i=>i.ctn===norm(p.ctn));
          if(!item||item.voided||item.scanId!==p.scanId)fail('STALE_LOOKUP','查詢對象已變更，不套用舊回應');
          const info=p.result||{};
          if(!['FOUND','NOT_FOUND','ERROR','CONFLICT','NON_CYLINDER'].includes(info.state))fail('INVALID_LOOKUP','查詢結果不完整');
          if(info.state==='FOUND'&&!rtPattern.test(String(info.rt||'')))fail('INVALID_LOOKUP','IQC 回應的 RT 不正確');
          // Once a source snapshot is accepted, neither retries nor OQC edits rewrite it.
          if(item.iqc.state==='FOUND')break;
          item.iqc={state:info.state,rt:info.state==='FOUND'?String(info.rt):'',status:info.state==='FOUND'?text(info.status,50,'狀態').toUpperCase():'',
            checkedAt:info.checkedAt||when,message:text(info.message,200,'訊息')};
          if(!item.rtChanges.length)item.rt=item.iqc.rt;
          break;
        }
        case 'RT_CHANGE':{
          const next=text(p.rt,10,'RT');
          if(!rtPattern.test(next))fail('INVALID_RT','RT 必須是 5～10 碼數字');
          if(!Array.isArray(p.items)||!p.items.length||p.items.length>500)fail('EMPTY_SELECTION','請先勾選鋼瓶');
          const unique=new Set();
          p.items.forEach(sel=>{
            const item=doc.items.find(i=>i.ctn===norm(sel.ctn));
            if(unique.has(sel.ctn))fail('DUPLICATE_SELECTION','選取重複');unique.add(sel.ctn);
            if(!item||item.voided||item.iqc.state!=='FOUND'||item.rt!==String(sel.fromRt))fail('STALE_SELECTION','選取的鋼瓶或 RT 已變更');
            if(item.rt!==next){item.rtChanges.push({oldRt:item.rt,newRt:next,at:when,by:actor,operationId:cmd.id});item.rt=next;}
          });break;
        }
        case 'VOID':{
          const item=doc.items.find(i=>i.ctn===norm(p.ctn));
          if(!item||item.voided||item.scanId!==p.scanId)fail('STALE_SELECTION','鋼瓶資料已變更');
          item.voided=true;item.voidId=cmd.id;break;
        }
        case 'RESTORE':{
          const item=doc.items.find(i=>i.ctn===norm(p.ctn));
          if(!item||!item.voided||item.voidId!==p.voidId)fail('STALE_SELECTION','作廢紀錄已變更，不能套用舊復原');
          item.voided=false;item.voidId='';break;
        }
        case 'SETTINGS':{
          doc.shippingRef=text(p.shippingRef,80,'裝框／出貨識別');doc.note=text(p.note,120,'備註');
          const n=p.targetQty===''||p.targetQty==null?null:Number(p.targetQty);
          if(n!==null&&(!Number.isInteger(n)||n<1||n>9999))fail('INVALID_QUANTITY','標籤總量必須是 1～9999');
          doc.targetQty=n;break;
        }
        case 'CLOSE':{
          const s=summary(doc);
          if(!doc.shippingRef)fail('SHIPPING_REF_REQUIRED','請先填寫裝框／出貨識別');
          if(!s.total)fail('EMPTY_BATCH','空批次不能送出');
          if(s.conflicts)fail('UNRESOLVED_CONFLICT','有資料衝突或非鋼瓶項目，請確認後先作廢誤掃');
          if(p.signature!==signature(doc))fail('STALE_CLOSE','清單已變更，請重新確認完成摘要');
          if((s.pending||s.missing||doc.targetQty&&doc.targetQty!==s.total)&&p.acknowledge!==true)fail('CONFIRM_REQUIRED','請確認缺 IQC／待查項目與數量差異');
          doc.phase='CLOSED';doc.closedAt=when;doc.closedBy=actor;
          doc.receipt={id:(ctx.simulated?'SIM-':'OQC-DEMO-')+doc.number+'-'+cmd.id.slice(-8),operationId:cmd.id,
            environment:ctx.simulated?'LOCAL_SIMULATION':VERSION,batchId:doc.id,number:doc.number,shippingRef:doc.shippingRef,
            total:s.total,missing:s.missing,pending:s.pending,at:when,actor,notQualityRelease:true};break;
        }
        default:fail('UNKNOWN_ACTION','不支援的操作');
      }
    }
    doc.revision++;
    doc.applied[cmd.id]=canonical(cmd);
    doc.history.push({id:cmd.id,type:cmd.type,at:when,by:actor});
    return doc;
  }
  function resolveIqc(response,rawCtn){
    const ctn=norm(rawCtn),r=response&&response.result,iqc=r&&r.iqc;
    if(!response||response.ok!==true||!r||norm(r.normalizedQuery||r.query)!==ctn||r.queryType!=='CTN'||
       !iqc||!['bottleRows','transportCards','bundleCards','submissionRows'].every(k=>Array.isArray(iqc[k])))fail('INVALID_RESPONSE','IQC 回應不完整，不能判為未建IQC');
    const rows=[...iqc.bottleRows,...iqc.submissionRows];
    iqc.transportCards.forEach(c=>rows.push(...(c.rows||[])));
    const found=rows.filter(x=>norm(x.ctn)===ctn);
    if(!found.length){
      const bundle=iqc.bundleCards.some(c=>norm(c.ctn||c.bundleCtn)===ctn||(c.rows||[]).some(x=>norm(x.ctn)===ctn));
      const frame=iqc.transportCards.some(c=>norm(c.transportFrameCtn)===ctn);
      return {state:bundle||frame?'NON_CYLINDER':'NOT_FOUND',rt:'',status:'',message:bundle||frame?'這是框架／集束 CTN，請確認誤掃':'',checkedAt:new Date().toISOString()};
    }
    const rts=Array.from(new Set(found.map(x=>String(x.rt||'').trim().replace(/^RT/i,''))));
    if(rts.length!==1||!rtPattern.test(rts[0]))return {state:'CONFLICT',rt:'',status:'',message:'IQC RT 資料衝突',checkedAt:new Date().toISOString()};
    const row=found.slice().sort((a,b)=>(Date.parse(b.date||b.createdAt)||0)-(Date.parse(a.date||a.createdAt)||0))[0];
    return {state:'FOUND',rt:rts[0],status:String(row.bottleStatus||row.status||'').trim().toUpperCase(),message:'',checkedAt:new Date().toISOString()};

  return await Promise.race([task,new Promise((_,reject)=>{timer=setTimeout(()=>{const e=Error(name==='batch_sync'?'同步回應逾時：結果待確認，原請求編號保留，請同步／重試。不是已確認失敗。':'RT查詢逾時：CTN 保留，尚不能判定未建IQC');e.code='TIMEOUT';reject(e);ctrl.abort();},timeout);})]);
 }catch(e){if(['SESSION_REQUIRED','SESSION_EXPIRED','UNAUTHORIZED','ACCOUNT_DISABLED','FORBIDDEN'].includes(e.code))ready=false;throw e;}finally{clearTimeout(timer);}
}
function checkBackend(v){if(v.backendVersion!=='0.2.3'){compatible=false;ready=false;throw Error('測試後端尚未更新至 0.2.3。請覆蓋同一 DEMO Code.gs、更新既有部署；網址與資料不需重建。');}compatible=true;}
async function verify(){if(ready)return;if(profileTask)return profileTask;profileTask=(async()=>{const h=await api('health',{},false);checkBackend(h);const p=await api('profile');checkBackend(p);if(!p.actor)throw Error('後端沒有傳回使用者身分');await S.change(key,v=>{v.actor=p.actor;v.lastVerified=now();});ready=true;issue='';$('realConnection').open=false;await reload();})();render();try{await profileTask;}finally{profileTask=null;render();}}
async function connect(){if(profileTask||syncTask||queryRunning||connecting)throw Error('目前作業進行中，請稍候');const endpoint=$('endpoint').value.trim();if(!validUrl(endpoint))throw Error('請填原 DEMO 網頁應用程式 /exec 網址');if(endpoint!==cfg.endpoint&&(root.pending.length||root.inflight))throw Error('原後端還有待傳資料，請恢復原網址，不能丟棄待傳操作');connecting=true;const old=cfg.endpoint,oldKey=key;
 try{cfg.endpoint=endpoint;key=envKey();ready=false;compatible=false;const h=await api('health',{},false);checkBackend(h);localStorage.setItem('oqc_stage1_config',JSON.stringify(cfg));await reload();await verify();await findRecovery();}catch(e){if(!compatible){cfg.endpoint=old;key=oldKey;await reload();}throw e;}finally{connecting=false;render();}await resume();}
function scheduleSync(){clearTimeout(serialTimer);serialTimer=setTimeout(()=>sync().catch(error),650);}
async function sync(){if(syncTask)return syncTask;if(!ready||offline())return;clearTimeout(serialTimer);const k=key;
 syncTask=(async()=>{for(let n=0;n<20;n++){const packet=await S.change(k,v=>{if(v.blocked)return null;if(v.inflight)return D.clone(v.inflight);if(!v.pending.length)return null;const id=v.pending[0].batchId;v.inflight={requestId:uid('req'),batchId:id,operations:v.pending.filter(c=>c.batchId===id).slice(0,12)};return D.clone(v.inflight);});if(!packet)break;
  const reply=await api('batch_sync',packet);if(cfg.mode==='SIM'&&$('lostReply').checked){$('lostReply').checked=false;throw Error('模擬回應遺失：已保存，按同步／重試查回同一請求');}
  if(reply.requestId!==packet.requestId||!reply.doc||!Array.isArray(reply.ackIds)||packet.operations.some(c=>!reply.ackIds.includes(c.id)))throw Error('後端確認不完整；原請求保留');
  await S.change(k,v=>{const ack=new Set(reply.ackIds);v.pending=v.pending.filter(c=>!ack.has(c.id));let d=D.clone(reply.doc);for(const c of v.pending.filter(c=>c.batchId===packet.batchId))d=D.run(d,c,{actor:v.actor,simulated:cfg.mode==='SIM'});v.docs[d.id]=d;if(reply.doc.receipt)v.receipts[d.id]=reply.doc.receipt;v.inflight=null;v.lastError=false;v.lastMessage=reply.projectionWarning|| (cfg.mode==='SIM'?'模擬接收完成（非後端入帳）':'已保存至獨立 DEMO 後端');});issue='';await reload();
 }} )();render();try{await syncTask;}catch(e){await S.change(k,v=>{v.lastError=true;v.lastMessage=e.message;if(['REVISION_CONFLICT','IDEMPOTENCY_CONFLICT','CLOSED','STALE_SELECTION','DUPLICATE_CTN','STALE_CLOSE'].includes(e.code))v.blocked=e.message;});issue=e.message;throw e;}finally{syncTask=null;await reload();}}
async function resume(){await verify();await sync();pump(true);}
async function readRemote(){await verify();if(syncTask||root.pending.length||root.inflight)throw Error('先同步既有待傳操作，不覆蓋本機資料');const r=await api('batches');await S.change(key,v=>{for(const d of r.docs||[]){v.docs[d.id]=d;if(d.receipt)v.receipts[d.id]=d.receipt;}if(!v.active)v.active=r.docs?.[0]?.id||'';});await reload();pump();}
function requiresLookup(i){return ['PENDING','ERROR'].includes(i.iqc.state)||(!i.iqc.lookupRuleset&&['NON_CYLINDER','FOUND'].includes(i.iqc.state));}
function pump(retry=false){if(retry)attempted.clear();if(!ready||offline()||closing)return;const tasks=[];Object.values(root.docs).filter(d=>d.phase==='OPEN').forEach(d=>D.active(d).filter(requiresLookup).forEach(i=>{const id=d.id+':'+i.scanId;if(!attempted.has(id)&&!inLookup.has(id))tasks.push({d,i,id});}));
 while(queryRunning<2&&tasks.length){const t=tasks.shift(),k=key;attempted.add(t.id);inLookup.add(t.id);queryRunning++;(async()=>{let info;try{const r=await api('iqc_lookup',{ctn:t.i.ctn});info={result:r.result,proof:r.proof||''};}catch(e){info={result:{state:'ERROR',rt:'',status:'',checkedAt:now(),message:e.message},proof:''};}if(k!==key)return;const v=await S.read(k),d=v.docs[t.d.id],i=d?.items.find(i=>i.ctn===t.i.ctn);if(!d||d.phase!=='OPEN'||!i||i.voided||i.scanId!==t.i.scanId)return;await mutate('IQC_RESULT',{ctn:i.ctn,scanId:i.scanId,...info},d.id);})().catch(error).finally(()=>{queryRunning--;inLookup.delete(t.id);render();pump();});}render();}
async function queryOnly(ctn){await verify();const id=++querySequence;queryItems.unshift({ctn,id,iqc:{state:'PENDING',rt:'',status:''},rt:'',rtChanges:[],capturedAt:now()});queryItems=queryItems.slice(0,100);$('scanInput').value='';render();try{const r=await api('iqc_lookup',{ctn});const item=queryItems.find(i=>i.id===id);if(item){item.iqc=r.result;item.rt=r.result.rt||'';}}catch(e){const i=queryItems.find(i=>i.id===id);if(i)i.iqc={state:'ERROR',message:e.message,rt:'',status:''};issue=e.message;}render();}
function itemHtml(i,n,query=false){const src=D.source(i),found=i.iqc.state==='FOUND',rt=i.rt||'',changed=!!rt&&(rt!==src.rt||(!src.rt&&i.rtChanges?.length));
 const status=src.status?'<span class="status">狀態 '+esc(src.status)+'</span>':'';
 const rtHtml=rt?'<div class="rtline">'+(src.rt&&rt!==src.rt?'RT '+esc(src.rt)+' <span class="arrow">→</span> ':'')+'<span class="'+(changed?'newrt':'')+'">RT '+esc(rt)+'</span></div>':'';
 const labels={FOUND:query?'IQC 參考':'OQC 待檢',NOT_FOUND:'未建IQC',NON_CYLINDER:'運輸框／需確認',CONFLICT:'IQC 衝突',ERROR:'查詢失敗',PENDING:'RT查詢中'};
 const badge=labels[i.iqc.state]||'待查IQC',bad=['NOT_FOUND','NON_CYLINDER','CONFLICT'].includes(i.iqc.state);
 const pick=!query&&editRt&&D.canRt(i)?'<input type="checkbox" class="pick" aria-label="選取 '+esc(i.ctn)+'" data-pick="'+esc(i.ctn)+'" '+(selected.has(i.ctn)?'checked':'')+'>':'<span class="number">'+n+'</span>';
 const type=D.kind(i)==='BUNDLE'?'<div class="type">集束 1 組'+(i.iqc.cylinderQty?'／'+i.iqc.cylinderQty+' 支':'／內含支數未確認')+'</div>':'';
 return '<div class="swipe">'+(!query?'<button class="delete" data-void="'+esc(i.ctn)+'" tabindex="-1">作廢誤掃</button>':'')+'<div class="item" '+(!query?'data-swipe="'+esc(i.ctn)+'"':'')+'>'+pick+'<div class="mainline"><b class="ctn">'+esc(i.ctn)+'</b>'+status+'</div>'+rtHtml+type+'<div class="flag '+(bad?'danger':found?'':'warning')+'">'+badge+'<small>'+esc(clock(i.capturedAt||i.scannedAt))+'</small></div></div></div>';
}
function render(){const query=workMode==='QUERY',d=active(),open=isOpen(),s=D.summary(d);$('version').textContent='DEMO V0.2.3';
 $('environment').textContent=cfg.mode==='SIM'?'合成範例演練｜非真實 IQC，非正式資料':ready?'實際 CTN 驗收｜0.2.3 後端已驗證｜非正式上線':'實際 CTN 驗收｜'+(profileTask||connecting?'連線驗證中':compatible?'等待 DS 連線':'請連接已更新的 0.2.3 DEMO 後端');
 $('queryMode').classList.toggle('active',query);$('packMode').classList.toggle('active',!query);$('modeHint').textContent=query?'僅查詢 IQC 參考，不建立批次、不增加裝框產量':'先保存 CTN；確認完成並收到後端收據，才算已完成裝框。';
 $('realConnection').classList.toggle('hidden',cfg.mode==='SIM');if(!ready&&cfg.mode==='RC')$('realConnection').open=true;
 $('packOnly').classList.toggle('hidden',query);$('packActions').classList.toggle('hidden',query);$('rtPanel').classList.toggle('hidden',query||!editRt||!open);
 $('batchSelect').innerHTML=Object.values(root.docs).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(x=>'<option value="'+x.id+'">'+esc(x.number)+'｜'+(x.phase==='OPEN'?'開放中':root.receipts[x.id]?.packingStatus==='PACKED'?'已完成裝框':'待確認收據')+'</option>').join('')||'<option value="">尚無批次</option>';$('batchSelect').value=root.active;
 $('batchMeta').textContent=d?(d.shippingRef?'裝框：'+d.shippingRef:'尚未填寫裝框識別')+'｜'+(d.workDate||'')+'｜'+(d.workers||root.actor):'掃描第一個 CTN 後建立批次';
 $('total').textContent=s.total;$('missing').textContent=s.missing;$('pending').textContent=s.pending;$('outbox').textContent=root.pending.length;$('unitSummary').textContent=D.countText(d);
 $('scanInput').disabled=connecting||profileTask||(query?!ready:!writeAllowed()||!!d&&!open);$('scanBtn').disabled=$('scanInput').disabled;$('scanBtn').textContent=query?'查詢':'掃描加入';
 ['settingsBtn','rtBtn','closeBtn'].forEach(id=>$(id).disabled=!open||!writeAllowed()||closing);$('newBatch').disabled=!writeAllowed()||closing||connecting;
 $('connect').disabled=connecting||!!profileTask||!!syncTask||queryRunning>0;$('syncBtn').disabled=!!syncTask||!!profileTask||connecting;$('retryIqc').disabled=!!profileTask||connecting;
 $('rtBtn').textContent=editRt?'取消 RT 更改':'RT 更改';$('selectionCount').textContent='已選 '+selected.size+' 件';$('applyRt').disabled=!selected.size;
 const failure=D.active(d).find(i=>i.iqc.state==='ERROR');$('syncState').textContent=query?(issue||'查詢結果只供參考，不回寫 IQC'):issue||root.blocked|| (syncTask?'資料同步中；尚未代表裝框完成':root.lastError?root.lastMessage:root.pending.length?'本機已保存，待傳 '+root.pending.length+' 項操作':root.lastMessage||'尚未提交裝框完成')+(failure?'｜'+(failure.iqc.message||'IQC 查詢失敗'):'');$('syncState').classList.toggle('danger',!!issue||!!root.lastError||!!root.blocked);
 let n=0;$('list').innerHTML=query?(queryItems.map(i=>itemHtml(i,++n,true)).join('')||'<div class="empty">掃描 CTN 查詢，不增加裝框紀錄。</div>'):(D.groups(d).map(g=>'<section class="group"><div class="group-head"><b>'+esc(g.title)+'</b><small>'+g.items.length+' 件</small></div>'+g.items.map(i=>itemHtml(i,++n)).join('')+'</section>').join('')||'<div class="empty">尚未收錄 CTN，空 RT 清單不顯示。</div>');
 const r=d&&root.receipts[d.id];$('receiptPanel').classList.toggle('hidden',query||!d||d.phase!=='CLOSED');$('receiptText').innerHTML=r?'<b>'+esc(r.id)+'</b><br>'+ (r.packingStatus==='PACKED'?'已完成裝框；出貨狀態未確認':'舊版完成紀錄；不能追認為已出貨')+'<br>'+esc(r.at)+'<br>'+esc(d.workers||r.actor)+'<br><span class="warning">'+(r.environment==='LOCAL_SIMULATION'?'模擬收據，不是後端入帳':'獨立 DEMO 收據，非正式出貨放行')+'</span>':'裝框完成請求已保存，等待後端確認；請同步／重試，不能當成已完成裝框。';
 $('simTools').classList.toggle('hidden',cfg.mode!=='SIM');$('recovery').classList.toggle('hidden',cfg.mode!=='RC'||!candidates.length);$('recoveryInfo').textContent=candidates.map(i=>i.ctn).join('、');$('recoverBtn').disabled=!ready||recovering||!!syncTask;
 bindSwipes();}
function bindSwipes(){if(workMode!=='PACK'||editRt||!isOpen())return;document.querySelectorAll('[data-swipe]').forEach(el=>{let start=null,dx=0,h=false;const reset=x=>{el.style.transform=x?'translateX(-88px)':'';if(el.previousElementSibling)el.previousElementSibling.tabIndex=x?0:-1;};el.onpointerdown=e=>{if(e.target.closest('input'))return;start=[e.clientX,e.clientY];dx=0;h=false;};el.onpointermove=e=>{if(!start)return;dx=e.clientX-start[0];const dy=e.clientY-start[1];if(!h&&Math.abs(dy)>Math.abs(dx)+7){start=null;reset(false);return;}if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){h=true;try{el.setPointerCapture(e.pointerId);}catch(_){}}if(h)el.style.transform='translateX('+Math.min(0,Math.max(-88,dx))+'px)';};el.onpointerup=()=>{if(start)reset(h&&dx< -35);start=null;};el.onpointercancel=()=>{start=null;reset(false);};});}
async function findRecovery(){if(cfg.mode!=='RC')return;const sim=await S.read('client-sim'),v=await S.read(key),seen=new Set();candidates=[];for(const d of Object.values(sim.docs))for(const i of D.active(d)){const id=d.id+':'+i.scanId;if(/^QA10(?:AA|AB)/.test(i.ctn)||v.simRecovery?.[id]||seen.has(i.ctn)||Object.values(v.docs).some(x=>D.active(x).some(y=>y.ctn===i.ctn)))continue;seen.add(i.ctn);candidates.push({ctn:i.ctn,sourceId:id,capturedAt:i.capturedAt||i.scannedAt});}render();}
async function recover(){if(!ready||recovering)return;await findRecovery();const rows=candidates.slice(0,500);if(!rows.length||!confirm('帶入 '+rows.length+' 件有效 CTN？不搬模擬 RT、收據；不復活已作廢項目。'))return;recovering=true;try{await S.change(key,v=>{v.simRecovery=v.simRecovery||{};const todo=rows.filter(i=>!v.simRecovery[i.sourceId]&&!Object.values(v.docs).some(d=>D.active(d).some(x=>x.ctn===i.ctn)));if(!todo.length)return;const id=createIn(v);todo.forEach(i=>{const c=command(v.docs[id],'SCAN',{ctn:i.ctn});c.at=i.capturedAt;v.docs[id]=D.run(v.docs[id],c,{actor:v.actor});v.pending.push(c);v.simRecovery[i.sourceId]={batchId:id,ctn:i.ctn,operationId:c.id};});});await reload();await findRecovery();scheduleSync();pump();}finally{recovering=false;render();}}
async function finish(){if(closing)return;closing=true;render();try{
 await verify();await sync();await reload();if(root.pending.length||root.inflight||root.blocked)throw Error('仍有待同步操作。此次尚未提交裝框完成，請先同步／重試。');
 const d=active();if(!d||d.phase!=='OPEN')throw Error('此批次已送出，請查詢原收據');
 // The reducer names the offending CTNs. Do not clear or void a legitimate bundle.
 await mutate('CLOSE',{signature:closeSig,acknowledge:true});$('closeDialog').close();await sync();
 }finally{closing=false;render();}}

safe(async()=>{await S.open();$('endpoint').value=cfg.endpoint;await reload();await findRecovery();await verify();await sync();pump(true);})();

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101942">
  <title>DS工作台｜Keyboard Nav RC</title>
  <style>
    html,body{margin:0;min-height:100%;background:#09112f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
    .boot{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center}.boot small{display:block;margin-top:8px;color:#aebce8}
  </style>
</head>
<body>
  <div class="boot">載入 DS Shell Keyboard RC…<small>正式 ds-app/ 不會被修改</small></div>
  <script>
  (async function(){
    try{
      const response=await fetch("../ds-app/index.html?keyboard_rc=20260819",{cache:"no-store"});
      if(!response.ok) throw new Error("無法載入正式 DS Shell index.html");
      let html=await response.text();

      html=html
        .replace('href="manifest.json"','href="./manifest.json"')
        .replace(/href="\.\/icons\//g,'href="../ds-app/icons/')
        .replace('href="app.css"','href="../ds-app/app.css"')
        .replace('</head>','<link rel="stylesheet" href="./keyboard-nav-hotfix.css?v=20260819"></head>')
        .replace('<script src="config.js"><\/script>','<script src="../ds-app/config.js"><\/script>')
        .replace('<script src="app.js"><\/script>','<script src="../ds-app/app.js"><\/script><script src="./keyboard-nav-hotfix.js?v=20260819"><\/script>');

      document.open();
      document.write(html);
      document.close();
    }catch(err){
      document.body.innerHTML='<div class="boot">測試版載入失敗<small>'+String(err&&err.message||err)+'</small></div>';
    }
  })();
  </script>
</body>
</html>

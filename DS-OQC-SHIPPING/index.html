<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101942"><title>庫存掃描｜OQC V1.1</title><style>:root{color-scheme:dark;--line:#536398;--muted:#b4c1df;--cyan:#67dce8;--red:#ff777f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;color:#f4f6ff;background:#121b45}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#102440,#29175a);min-height:100dvh}button,input,textarea,select{font:inherit}button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}button{border:1px solid var(--line);background:#303d78;color:inherit;border-radius:13px;min-height:44px;padding:10px 12px;font-size:14px;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:default}.primary,.modeNav .active{background:#6656f6;border-color:transparent}.hidden{display:none!important}header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:8px 12px;background:#09132ef5;border-bottom:1px solid var(--line)}header small{color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:.15em}h1{font-size:17px;margin:2px 0 0}h2{font-size:17px;margin:0 0 12px}.pill{margin-left:auto;border:1px solid #a88b4a;color:#ffd482;border-radius:20px;padding:5px 8px;font-size:10px;white-space:nowrap}main{max-width:840px;margin:auto;padding:12px 12px calc(95px + env(safe-area-inset-bottom,0px))}.notice{border:1px solid #b39753;background:#302c35;border-radius:13px;padding:10px 12px;font-size:12px;line-height:1.5;margin-bottom:12px}.panel{background:#14234fdb;border:1px solid var(--line);border-radius:19px;padding:13px;margin-bottom:12px}.batch-picker,.row,#scanForm,.modeNav{display:flex;gap:8px;align-items:center}.modeNav button{flex:1}.batch-picker select{flex:1;min-width:0}.batch-picker button{flex-shrink:0}input,textarea,select{border:1px solid #536990;background:#07192c;color:inherit;border-radius:12px;padding:10px;width:100%;font-size:16px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #67dce81a}#scanForm{margin:12px 0}#scanInput{min-width:0;font-size:20px;letter-spacing:.05em;text-transform:uppercase;height:52px}#scanBtn{white-space:nowrap;height:52px}.subtext{color:var(--muted);font-size:12px;line-height:1.55;margin:8px 0;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;font-size:11px;color:var(--muted);margin:10px 0}.stats span{padding:8px 4px;text-align:center;border-radius:10px;background:#08182eaa}.stats b{color:#fff;display:block;font-size:20px;margin-top:2px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.edit-panel{margin-top:12px;border:1px solid #56c9db;border-radius:14px;padding:11px}.edit-panel .row{margin-bottom:8px}.edit-panel .row:last-child{margin-bottom:0}#rtCancel{margin-left:auto}#selectionCount{color:var(--muted);font-size:12px}.group{padding:11px;border:1px solid #516aa0;border-radius:17px;background:#15214fe8;margin:10px 0}.group-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.group-head b{font-size:18px}.group-head small{font-size:12px;color:var(--muted)}.swipe{position:relative;overflow:hidden;touch-action:pan-y;border-radius:13px;margin:7px 0;background:#c34554}.delete{position:absolute;right:0;top:0;bottom:0;width:88px;background:#c34554;border:0;border-radius:0}.item{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:3px 6px;padding:10px 8px;border:1px solid #445784;border-radius:13px;background:#13224c;transition:transform .16s ease;min-height:58px}.number{grid-row:1/4;align-self:center;font-size:12px;color:#c7c8ff;background:#393b80;border-radius:8px;padding:5px 0;text-align:center}.pick{grid-column:1;grid-row:1/4;width:22px;height:24px;margin:0;align-self:center}.mainline{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;grid-column:2}.ctn{font-size:17px;font-weight:800;white-space:nowrap}.status{font-size:13px;font-weight:650;color:#b9c8e5}.rtline{grid-row:2;grid-column:2/-1;font-size:13px;font-weight:650;color:#ccd7ef;line-height:1.35}.type{grid-column:2/-1;grid-row:3;color:var(--muted);font-size:11px}.arrow{color:var(--cyan)}.newrt{color:#88e6c3}.flag{grid-row:1;grid-column:3;text-align:right;font-size:12px;white-space:nowrap;color:#7be2ba;font-weight:700}.flag small{display:block;color:var(--muted);font-weight:400;font-size:10px;margin-top:3px}.danger{color:var(--red)!important}.warning{color:#ffd078!important}.empty{padding:25px 12px;text-align:center;color:var(--muted);font-size:14px}details summary{font-size:15px;font-weight:700;cursor:pointer}.tools{padding-top:12px}.tools .row{flex-wrap:wrap;margin:8px 0}.tools .row button{flex:1}.check{display:flex;align-items:center;gap:8px;font-size:13px;margin:13px 0}.check input{width:22px;height:22px;margin:0}dialog{width:min(92%,480px);max-height:85dvh;overflow:auto;color:#fff;background:#14213a;border:1px solid var(--line);border-radius:18px;padding:18px}dialog::backdrop{background:#000b}dialog label{display:block;color:var(--muted);font-size:12px;margin:12px 0}dialog label input,dialog label textarea{display:block;margin-top:6px}dialog .row{justify-content:flex-end;margin-top:12px}#closeSummary,#receiptText{font-size:13px;line-height:1.8;overflow-wrap:anywhere}#toast,#undo{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(92%,680px);z-index:50;background:#08172d;border:1px solid var(--line);border-radius:15px;padding:13px;font-size:14px;box-shadow:0 10px 35px #0007}#undo{display:flex;align-items:center;justify-content:space-between;border-color:#b49859}#undo button{background:#e9c66e;color:#15213d}#receiptPanel button{margin-top:12px}@media(max-width:360px){.item{grid-template-columns:22px minmax(0,1fr) auto;column-gap:4px}.ctn{font-size:16px}.status{font-size:12px}.flag{font-size:11px}.pill{font-size:9px}.stats{font-size:10px}button{font-size:13px;padding:9px}main{padding-left:8px;padding-right:8px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.history-item{margin:8px 0}#historyPanel input{min-width:0}#historyPanel .row{flex-wrap:wrap}#historyPanel .row>*{flex:1}#historyDate{max-width:100%}#historyList summary{overflow-wrap:anywhere}.modeNav button{padding:10px 6px;min-width:0}</style><script src="../ds-app/config.js"></script><script src="../ds-app/portal-gate.js"></script></head><body>
<header><div><small>OQC INVENTORY</small><h1>庫存掃描</h1></div><span class="pill" id="version">OQC V1.1</span></header><main>
<div class="notice" id="environment">正在準備 OQC 資料，請稍候…</div>
<details class="panel" id="realConnection" open><summary>連接實際 CTN 驗收</summary><div class="tools"><input id="endpoint" type="url" placeholder="OQC 後端網址" aria-label="DEMO 後端網址"><div class="row"><button id="connect">連接實際驗收</button></div><p class="subtext">前後端都必須更新到 0.2.3。沿用原 DEMO 專案、網址、資料與 DS 登入。</p></div></details>
<section class="panel hidden" id="recovery"><h2>取回先前的有效 CTN</h2><p class="subtext" id="recoveryInfo"></p><button id="recoverBtn">帶入實連查詢</button><p class="subtext">只帶 CTN 與原掃描時間，不帶模擬 RT／收據；原資料及作廢紀錄保留。</p></section>
<section class="panel"><div class="modeNav"><button id="packMode" class="active">裝框紀錄</button><button id="queryMode">僅查詢</button><button id="historyMode">歷史紀錄</button></div><p class="subtext" id="modeHint"></p>
<div id="packOnly"><div class="batch-picker"><select id="batchSelect" aria-label="裝框批次"></select><button id="newBatch">＋新批次</button></div><p id="batchMeta" class="subtext"></p><div class="stats"><span>已收錄 <b id="total">0</b></span><span>未建IQC <b id="missing">0</b></span><span>待查 <b id="pending">0</b></span><span>待傳 <b id="outbox">0</b></span></div><p class="subtext" id="unitSummary"></p></div>
<form id="scanForm" autocomplete="off"><input id="scanInput" placeholder="掃描 CTN" aria-label="CTN" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="40"><button id="scanBtn" class="primary">掃描加入</button></form>
<div id="packActions" class="actions"><button id="settingsBtn">設定總量／備註</button><button id="rtBtn">RT 更改</button><button id="syncBtn">同步／重試</button><button id="closeBtn" class="primary">完成裝框批次</button></div>
<div class="edit-panel hidden" id="rtPanel"><div class="row"><b>RT 更改</b><span id="selectionCount"></span><button id="rtCancel">×</button></div><div class="row"><button id="selectAll">全選</button><button id="selectNone">清除</button><button id="rtRetry" type="button">重新查驗</button></div><div class="row"><input id="newRt" inputmode="numeric" maxlength="40" placeholder="輸入新 RT" aria-label="輸入新 RT"><button id="applyRt" class="primary" disabled>套用更改</button></div><p id="rtGateStatus" class="subtext" role="status" aria-live="polite"></p></div><div class="subtext" id="syncState" aria-live="polite"></div><button id="repairRtInlineG1" type="button" class="hidden">修復待傳 RT</button></section>
<div id="list"></div>
<section id="historyPanel" class="panel hidden"><h2>歷史紀錄</h2><div class="row"><label class="subtext">完成日期<input id="historyDate" type="date" aria-label="完成日期"></label><input id="historySearch" placeholder="搜尋批次編號／CTN" aria-label="搜尋歷史"></div><div class="row"><button id="historyClear">清除篩選</button><button id="historyRefresh">更新歷史</button></div><p id="historyCount" class="subtext"></p><div id="historyList"></div></section>
<section class="panel hidden" id="receiptPanel"><h2>完成確認</h2><div id="receiptText"></div><button id="checkReceipt">查詢原收據</button></section>
<details class="panel"><summary>資料與同步工具</summary><div class="tools"><div class="row"><button id="retryIqc">重試待查 IQC</button><button id="refreshRemote">讀取後端</button><button id="export">匯出操作紀錄</button><button id="repairRtG1" type="button">修復未套用 RT</button></div><label class="check hidden"><input type="checkbox" id="offline" disabled>模擬斷網</label><div id="simTools" class="hidden"><button id="samples">加入合成範例</button><label class="check"><input type="checkbox" id="lostReply">模擬已寫入但回應遺失</label></div></div></details>
</main>
<dialog id="settings"><form method="dialog"><h2>裝框資料</h2><label>裝框識別<input id="shippingRef" maxlength="80" placeholder="框號或本次作業識別"></label><label>作業日期<input id="workDate" type="date"></label><label>實際作業人員<input id="workers" maxlength="120" placeholder="填寫本次實際作業人員"></label><label>標籤總量（CTN 件數，可留空）<input id="target" type="number" inputmode="numeric" min="1" max="9999"></label><label>備註<textarea id="note" maxlength="120" rows="2"></textarea></label><div class="row"><button value="cancel">取消</button><button class="primary" id="saveSettings" type="button">儲存</button></div></form></dialog>
<dialog id="closeDialog"><h2>確認完成裝框</h2><div id="closeSummary"></div><p class="subtext">確認下列未建 IQC／待查項目與數量後，提交裝框完成。出貨狀態仍為未確認，不等於品質放行。</p><p id="closeError" class="subtext" role="alert" style="white-space:pre-line"></p><div class="row"><button id="cancelClose">取消</button><button id="confirmClose" class="primary">確認完成裝框</button></div></dialog>
<div id="toast" class="hidden" role="status"></div><div id="undo" class="hidden"><span id="undoText"></span><button id="undoBtn">復原</button></div>
<script>/* OQC shipping DEMO V0.2.0. Pure command reducer shared by browser and RC backend. */
(function(g){
  'use strict';
  const VERSION='OQC_SHIPPING_PROD_V1_20260918';
  const clone=x=>JSON.parse(JSON.stringify(x));
  const norm=x=>String(x==null?'':x).trim().toUpperCase();
  const ctnPattern=/^[A-Z]{2}\d{2}[A-Z]{2}[A-Z0-9]$/;
  const rtPattern=/^\d{5,10}$/;
  const fail=(code,message)=>{const e=new Error(message);e.code=code;throw e;};
  function canonical(x){
    if(Array.isArray(x)) return '['+x.map(canonical).join(',')+']';
    if(x&&typeof x==='object') return '{'+Object.keys(x).sort().map(k=>JSON.stringify(k)+':'+canonical(x[k])).join(',')+'}';
    return JSON.stringify(x);
  }
  function active(doc){return (doc&&doc.items||[]).filter(i=>!i.voided);}
  // Compact non-secret UI snapshot checksum. Revision checks and server SHA-256
  // idempotency hashes remain authoritative; this is not an authentication primitive.
  function fingerprint(value){
    const s=canonical(value);let a=2166136261,b=2246822507;
    for(let n=0;n<s.length;n++){a=Math.imul(a^s.charCodeAt(n),16777619);b=Math.imul(b^s.charCodeAt(n),3266489909);}
    return 'view-'+(a>>>0).toString(16).padStart(8,'0')+(b>>>0).toString(16).padStart(8,'0');
  }
  function signature(doc){
    return fingerprint({ref:doc.shippingRef,target:doc.targetQty,items:active(doc).map(i=>({ctn:i.ctn,rt:i.rt,iqc:i.iqc.state,status:i.iqc.status,changes:i.rtChanges.map(c=>[c.oldRt,c.newRt,c.operationId])})).sort((a,b)=>a.ctn.localeCompare(b.ctn))});
  }
  function summary(doc){
    const items=active(doc);
    return {total:items.length,found:items.filter(i=>i.iqc.state==='FOUND').length,
      missing:items.filter(i=>i.iqc.state==='NOT_FOUND').length,
      pending:items.filter(i=>['PENDING','ERROR'].includes(i.iqc.state)).length,
      conflicts:items.filter(i=>['CONFLICT','NON_CYLINDER'].includes(i.iqc.state)).length,
      voided:(doc&&doc.items||[]).filter(i=>i.voided).length};
  }
  function groups(doc){
    const map=new Map();
    active(doc).forEach(i=>{
      const key=i.iqc.state==='FOUND'?'RT '+i.rt:i.iqc.state==='NOT_FOUND'?'未建IQC':'待確認';
      if(!map.has(key))map.set(key,[]);
      map.get(key).push(i);
    });
    return Array.from(map.entries()).map(([title,items])=>({title,items}));
  }
  function text(value,max,name){
    const s=String(value==null?'':value).trim();
    if(s.length>max)fail('FIELD_TOO_LONG',name+'過長');return s;
  }
  function run(input,command,context){
    const cmd=clone(command),ctx=context||{},p=cmd.data||{},when=ctx.time||cmd.at,actor=ctx.actor||'DEMO';
    if(!/^op_[a-z0-9_-]{8,100}$/i.test(cmd.id||'')||!/^b_[a-z0-9_-]{8,100}$/i.test(cmd.batchId||''))fail('INVALID_ID','操作編號不正確');
    if(!when||!Number.isFinite(Date.parse(when)))fail('INVALID_TIME','操作時間不正確');
    let doc=input?clone(input):null;
    if(doc&&doc.applied[cmd.id]){
      if(doc.applied[cmd.id]!==canonical(cmd))fail('IDEMPOTENCY_CONFLICT','同一操作編號的內容不同');
      return doc;
    }
    if(Number(cmd.base)!==Number(doc?doc.revision:0))fail('REVISION_CONFLICT','資料已在其他裝置更新；請先更新並檢查待送資料');
    if(cmd.type==='CREATE'){
      if(doc)fail('EXISTS','此批次已存在');
      doc={id:cmd.batchId,number:ctx.number||p.number||'',revision:0,phase:'OPEN',shippingRef:'',note:'',targetQty:null,
        createdAt:when,createdBy:actor,items:[],applied:{},history:[],receipt:null};
    }else{
      if(!doc)fail('NOT_FOUND','批次不存在');
      if(doc.phase!=='OPEN')fail('CLOSED','已完成的批次不能直接修改');
      switch(cmd.type){
        case 'SCAN':{
          const ctn=norm(p.ctn);
          if(!ctnPattern.test(ctn))fail('INVALID_CTN','CTN 格式錯誤，本次未收錄');
          let item=doc.items.find(i=>i.ctn===ctn);
          if(item&&!item.voided)fail('DUPLICATE_CTN','CTN 已在本批次，不重複計數');
          if(item){item.voided=false;item.voidId='';item.scannedAt=when;item.capturedAt=cmd.at;item.scanId=cmd.id;}
          else{
            if(doc.items.length>=500)fail('BATCH_LIMIT','每批最多 500 件 CTN');
            item={ctn,scanId:cmd.id,scannedAt:when,capturedAt:cmd.at,scannedBy:actor,voided:false,voidId:'',rt:'',rtChanges:[],
              iqc:{state:'PENDING',rt:'',status:'',checkedAt:'',message:''}};
            doc.items.push(item);
          }break;
        }
        case 'IQC_RESULT':{
          const item=doc.items.find(i=>i.ctn===norm(p.ctn));
          if(!item||item.voided||item.scanId!==p.scanId)fail('STALE_LOOKUP','查詢對象已變更，不套用舊回應');
          const info=p.result||{};
          if(!['FOUND','NOT_FOUND','ERROR','CONFLICT','NON_CYLINDER'].includes(info.state))fail('INVALID_LOOKUP','查詢結果不完整');
          if(info.state==='FOUND'&&!rtPattern.test(String(info.rt||'')))fail('INVALID_LOOKUP','IQC 回應的 RT 不正確');
          // Once a source snapshot is accepted, neither retries nor OQC edits rewrite it.
          if(item.iqc.state==='FOUND')break;
          item.iqc={state:info.state,rt:info.state==='FOUND'?String(info.rt):'',status:info.state==='FOUND'?text(info.status,50,'狀態').toUpperCase():'',
            checkedAt:info.checkedAt||when,message:text(info.message,200,'訊息')};
          if(!item.rtChanges.length)item.rt=item.iqc.rt;
          break;
        }
        case 'RT_CHANGE':{
          const next=text(p.rt,10,'RT');
          if(!rtPattern.test(next))fail('INVALID_RT','RT 必須是 5～10 碼數字');
          if(!Array.isArray(p.items)||!p.items.length||p.items.length>500)fail('EMPTY_SELECTION','請先勾選鋼瓶');
          const unique=new Set();
          p.items.forEach(sel=>{
            const item=doc.items.find(i=>i.ctn===norm(sel.ctn));
            if(unique.has(sel.ctn))fail('DUPLICATE_SELECTION','選取重複');unique.add(sel.ctn);
            if(!item||item.voided||item.iqc.state!=='FOUND'||item.rt!==String(sel.fromRt))fail('STALE_SELECTION','選取的鋼瓶或 RT 已變更');
            if(item.rt!==next){item.rtChanges.push({oldRt:item.rt,newRt:next,at:when,by:actor,operationId:cmd.id});item.rt=next;}
          });break;
        }
        case 'VOID':{
          const item=doc.items.find(i=>i.ctn===norm(p.ctn));
          if(!item||item.voided||item.scanId!==p.scanId)fail('STALE_SELECTION','鋼瓶資料已變更');
          item.voided=true;item.voidId=cmd.id;break;
        }
        case 'RESTORE':{
          const item=doc.items.find(i=>i.ctn===norm(p.ctn));
          if(!item||!item.voided||item.voidId!==p.voidId)fail('STALE_SELECTION','作廢紀錄已變更，不能套用舊復原');
          item.voided=false;item.voidId='';break;
        }
        case 'SETTINGS':{
          doc.shippingRef=text(p.shippingRef,80,'裝框／出貨識別');doc.note=text(p.note,120,'備註');
          const n=p.targetQty===''||p.targetQty==null?null:Number(p.targetQty);
          if(n!==null&&(!Number.isInteger(n)||n<1||n>9999))fail('INVALID_QUANTITY','標籤總量必須是 1～9999');
          doc.targetQty=n;break;
        }
        case 'CLOSE':{
          const s=summary(doc);
          if(!doc.shippingRef)fail('SHIPPING_REF_REQUIRED','請先填寫裝框／出貨識別');
          if(!s.total)fail('EMPTY_BATCH','空批次不能送出');
          if(s.conflicts)fail('UNRESOLVED_CONFLICT','有資料衝突或非鋼瓶項目，請確認後先作廢誤掃');
          if(p.signature!==signature(doc))fail('STALE_CLOSE','清單已變更，請重新確認完成摘要');
          if((s.pending||s.missing||doc.targetQty&&doc.targetQty!==s.total)&&p.acknowledge!==true)fail('CONFIRM_REQUIRED','請確認缺 IQC／待查項目與數量差異');
          doc.phase='CLOSED';doc.closedAt=when;doc.closedBy=actor;
          doc.receipt={id:(ctx.simulated?'SIM-':'OQC-')+doc.number+'-'+cmd.id.slice(-8),operationId:cmd.id,
            environment:ctx.simulated?'LOCAL_SIMULATION':VERSION,batchId:doc.id,number:doc.number,shippingRef:doc.shippingRef,
            total:s.total,missing:s.missing,pending:s.pending,at:when,actor,notQualityRelease:true};break;
        }
        default:fail('UNKNOWN_ACTION','不支援的操作');
      }
    }
    doc.revision++;
    doc.applied[cmd.id]=canonical(cmd);
    doc.history.push({id:cmd.id,type:cmd.type,at:when,by:actor});
    return doc;
  }
  function resolveIqc(response,rawCtn){
    const ctn=norm(rawCtn),r=response&&response.result,iqc=r&&r.iqc;
    if(!response||response.ok!==true||!r||norm(r.normalizedQuery||r.query)!==ctn||r.queryType!=='CTN'||
       !iqc||!['bottleRows','transportCards','bundleCards','submissionRows'].every(k=>Array.isArray(iqc[k])))fail('INVALID_RESPONSE','IQC 回應不完整，不能判為未建IQC');
    const rows=[...iqc.bottleRows,...iqc.submissionRows];
    iqc.transportCards.forEach(c=>rows.push(...(c.rows||[])));
    const found=rows.filter(x=>norm(x.ctn)===ctn);
    if(!found.length){
      const bundle=iqc.bundleCards.some(c=>norm(c.ctn||c.bundleCtn)===ctn||(c.rows||[]).some(x=>norm(x.ctn)===ctn));

function bindSwipes(){if(workMode!=='PACK'||editRt||!isOpen())return;document.querySelectorAll('[data-swipe]').forEach(el=>{let start=null,dx=0,h=false;const reset=x=>{el.style.transform=x?'translateX(-88px)':'';if(el.previousElementSibling)el.previousElementSibling.tabIndex=x?0:-1;};el.onpointerdown=e=>{if(e.target.closest('input'))return;start=[e.clientX,e.clientY];dx=0;h=false;};el.onpointermove=e=>{if(!start)return;dx=e.clientX-start[0];const dy=e.clientY-start[1];if(!h&&Math.abs(dy)>Math.abs(dx)+7){start=null;reset(false);return;}if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){h=true;try{el.setPointerCapture(e.pointerId);}catch(_){}}if(h)el.style.transform='translateX('+Math.min(0,Math.max(-88,dx))+'px)';};el.onpointerup=()=>{if(start)reset(h&&dx< -35);start=null;};el.onpointercancel=()=>{start=null;reset(false);};});}

async function recover(){if(!ready||recovering)return;await findRecovery();const rows=candidates.slice(0,500);if(!rows.length||!confirm('帶入 '+rows.length+' 件有效 CTN？不搬模擬 RT、收據；不復活已作廢項目。'))return;recovering=true;try{await S.change(key,v=>{v.simRecovery=v.simRecovery||{};const todo=rows.filter(i=>!v.simRecovery[i.sourceId]&&!Object.values(v.docs).some(d=>D.active(d).some(x=>x.ctn===i.ctn)));if(!todo.length)return;const id=createIn(v);todo.forEach(i=>{const c=command(v.docs[id],'SCAN',{ctn:i.ctn});c.at=i.capturedAt;v.docs[id]=D.run(v.docs[id],c,{actor:v.actor});v.pending.push(c);v.simRecovery[i.sourceId]={batchId:id,ctn:i.ctn,operationId:c.id};});});await reload();await findRecovery();scheduleSync();pump();}finally{recovering=false;render();}}
function rtSnapshot(v=root){
 const d=v.docs[v.active],items=D.active(d).filter(i=>selected.has(i.ctn)&&D.canRt(i)),raw=$('newRt').value;
 const rt=G.normalizeRt(raw);
 return {rt,items,key,id:d?.id,stamp:D.canonical({key,actor:v.actor,auth:hash(token()),authEpoch,ready,offline:offline(),mode:workMode,edit:editRt,id:d?.id||'',revision:d?.revision||0,phase:d?.phase||'',raw,selected:Array.from(selected).sort(),items:items.map(i=>[i.ctn,i.scanId,i.rt,i.iqc.state,D.kind(i)])})};
}
function invalidateRt(){clearTimeout(rtTimer);rtSeq++;rtGate={stamp:'',status:'idle',message:''};$('applyRt').disabled=true;}
function paintRtGate(){
 const snap=rtSnapshot();
 if(snap.stamp!==rtGate.stamp){
  clearTimeout(rtTimer);const seq=++rtSeq;rtGate={stamp:snap.stamp,status:'idle',message:'',startedAt:Date.now()};
  if(editRt&&workMode==='PACK'&&isOpen()){
   if(!snap.items.length)rtGate.message='請先勾選項目';
   else if(!D.rtPattern.test(snap.rt))rtGate.message=snap.rt?'請輸入完整的 5～10 碼 RT 數字':'請輸入要套用的 RT';
   else if(offline())rtGate.message='目前離線，RT 尚未驗證，未套用';
   else{rtGate.status='checking';rtGate.message=catalogSupported&&!rtCatalog.status().fresh?'RT 主檔載入中，尚未套用…':'RT list 查驗中…';rtTimer=setTimeout(()=>checkRt(snap,seq),cachedRt(snap.rt)?0:200);}
  }
 }
 $('rtGateStatus').textContent=rtApplying?'正在確認並套用…':rtGate.message;
 $('rtGateStatus').classList.toggle('danger',rtGate.status==='invalid');
 $('applyRt').disabled=rtApplying||repairingRt||closing||offline()||rtGate.status!=='valid'||!ready||snap.stamp!==rtGate.stamp;
 $('rtRetry').disabled=rtApplying||repairingRt||closing||offline()||rtGate.status==='checking';
}
async function lookupRt(snap){
 await verify();const r=await (catalogSupported?rtCatalog.get(snap.rt):rtLookups.get(snap.rt));
 if(rtSnapshot().stamp!==snap.stamp||offline()||!ready)throw Error('RT 輸入、選取或批次已改變，請重新查驗');
 return G.validateReply(snap.rt,snap.items,r);
}
async function checkRt(snap,seq){
 const startedAt=rtGate.startedAt||Date.now(),source=catalogSupported?(rtCatalog.status().fresh?'catalog':'catalog-load'):(rtLookups.peek(snap.rt)?'recent-lookup':'single-lookup');let outcome='ok';
 try{
  const data=await lookupRt(snap);
  if(seq!==rtSeq||rtSnapshot().stamp!==snap.stamp)return;
  rtGate={stamp:snap.stamp,status:'valid',...data,message:'RT '+snap.rt+'｜'+data.rtMaster.section+'｜'+data.rtMaster.description+'｜可套用｜'+((Date.now()-startedAt)/1000).toFixed(1)+' 秒'};
 }catch(e){if(seq!==rtSeq||rtSnapshot().stamp!==snap.stamp)return;outcome=e.code||'ERROR';rtGate={stamp:snap.stamp,status:'invalid',message:e.message.includes('未套用')?e.message:e.message+'（未套用）'};}
 rtMeasurements.push({rt:snap.rt,at:now(),elapsedMs:Date.now()-startedAt,source,outcome});if(rtMeasurements.length>30)rtMeasurements.shift();
 paintRtGate();
}
async function applyRtG1(){
 const snap=rtSnapshot();
 if(rtApplying||repairingRt||closing||offline()||rtGate.status!=='valid'||snap.stamp!==rtGate.stamp)return;
 rtApplying=true;render();
 try{
  let checked=await lookupRt(snap);
  if(!confirm('將 '+snap.items.length+' 件的 OQC RT 改為 '+snap.rt+'？IQC 原始資料不變。'))return;
  if(rtSnapshot().stamp!==snap.stamp)throw Error('資料已更新，未套用，請重新查驗');
  if(!cachedRt(snap.rt))checked=await lookupRt(snap);
  await mutate('RT_CHANGE',{rt:snap.rt,items:snap.items.map(i=>({ctn:i.ctn,fromRt:i.rt})),...checked},snap.id,snap.stamp);
  editRt=false;selected.clear();invalidateRt();issue='';
 }catch(e){e.oqcScope='rt';invalidateRt();rtGate={stamp:rtSnapshot().stamp,status:'invalid',message:e.message+'（未套用）'};throw e;}
 finally{rtApplying=false;render();}
}
async function repairRtQueueG1(batchId=root.active){
 if(repairingRt||closing||rtApplying)return;
 if(cfg.mode==='SIM')throw Error('合成範例不操作真實 RT 修復；請在正式 OQC 使用此功能');
 const target={key,id:batchId};
 if(!confirm('查核 '+(root.docs[batchId]?.number||batchId)+' 的原待傳請求，僅復原後端明確拒絕的錯誤 RT？CTN、合法操作與修復紀錄均保留。'))return;
 repairingRt=true;clearTimeout(serialTimer);invalidateRt();render();
 try{
  if(syncTask)try{await syncTask;}catch(_){}
  await verify();if(key!==target.key)throw Error('後端連線已變更，未修復');
  const packet=await S.change(target.key,v=>{
   if(v.inflight){if(v.inflight.batchId!==target.id)throw Error('另一批次的原請求仍待確認，請先處理該批次');return D.clone(v.inflight);}
   const ops=v.pending.filter(c=>c.batchId===target.id).slice(0,12);
   if(!ops.some(c=>c.type==='RT_CHANGE'))throw Error('前段沒有 RT 更改，請先按「同步／重試」傳送既有操作');
   v.inflight={requestId:uid('req'),batchId:target.id,operations:ops};return D.clone(v.inflight);
  });
  const before=await S.read(target.key),expected=G.recoveryState(before,packet.batchId);
  const reply=await api('recover_rt_queue',{packet,confirmed:true});
  if(key!==target.key)throw Error('後端連線已變更，原請求保留');
  await S.change(target.key,v=>G.reconcile(v,packet,reply,expected,uid,now()));
  issue='';await reload();toast(root.lastMessage);
 }finally{repairingRt=false;await reload();}
 scheduleSync();pump();
}
async function validateCloseRt(doc){
 const changed=D.active(doc).filter(i=>i.rtChanges?.length);
 for(const rt of new Set(changed.map(i=>i.rt))){
  try{const response=await api('rt_lookup',{rt});G.validateReply(rt,changed.filter(i=>i.rt===rt),response);}
  catch(e){throw Error(changed.filter(i=>i.rt===rt).map(i=>i.ctn).join('、')+'：'+e.message+'。尚未提交完成；請先核對 RT，必要時使用「修復未套用 RT」。');}
 }
}
async function finish(){
 if(closing||repairingRt)return;const target=closeTarget;if(!target)return;
 closing=true;$('closeError').classList.remove('danger');$('closeError').textContent='正在同步與查核，取得後端收據才算完成…';render();
 try{
  await verify();await sync();await reload();
  if(key!==target.key||root.active!==target.id)throw Error('批次已切換，請重新確認');
  const d=root.docs[target.id];
  if(d?.phase==='CLOSED'){
   if(root.receipts[d.id]?.packingStatus==='PACKED'&&!root.pending.some(c=>c.batchId===d.id)&&root.inflight?.batchId!==d.id){$('closeDialog').close();toast('已取回原完成收據；出貨狀態未確認');return;}
   throw Error('完成結果待確認；原請求保留，請按「查詢原完成結果」或「同步／重試」，不會建立另一筆完成操作');
  }
  if(!d||d.phase!=='OPEN')throw Error('批次已非開放中，請核對歷史紀錄');
  const problems=G.closeProblems(d);if(problems.length)throw Error(problems.join('\n'));
  if(root.pending.length||root.inflight||root.blocked)throw Error('仍有待同步操作，尚未提交裝框完成；請先同步／重試，錯誤 RT 可從 資料與同步工具修復');
  await validateCloseRt(d);
  if(key!==target.key||root.active!==target.id||D.signature(active())!==closeSig)throw Error('清單已更新，請取消後重新核對完成摘要');
  heldCompletion=d.id;await mutate('CLOSE',{signature:closeSig,acknowledge:true},d.id);await sync();await reload();
  if(root.receipts[d.id]?.packingStatus!=='PACKED'||root.pending.some(c=>c.batchId===d.id)||root.inflight?.batchId===d.id)throw Error('完成結果待確認；原請求保留，請查詢原完成結果');
  $('closeDialog').close();toast('已取得裝框完成收據；出貨狀態未確認');
 }finally{closing=false;render();}
}

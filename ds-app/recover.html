<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#07112b">
  <title>鼎世工作台｜安全復原</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;background:#07112b;color:#fff}
    body{display:grid;place-items:center;padding:24px}
    main{width:min(520px,100%);padding:26px 22px;border:1px solid rgba(210,220,255,.22);border-radius:24px;background:linear-gradient(160deg,rgba(41,62,145,.72),rgba(25,18,82,.86));box-shadow:0 24px 80px rgba(0,0,0,.45)}
    h1{margin:0 0 12px;font-size:26px}
    p{margin:8px 0;color:rgba(240,244,255,.78);line-height:1.65}
    #status{margin-top:18px;padding:14px;border-radius:15px;background:rgba(255,255,255,.08);font-weight:800}
    .ok{color:#b8ffd0}.bad{color:#ffd0d8}
  </style>
</head>
<body>
  <main>
    <h1>鼎世工作台安全復原</h1>
    <p>正在移除故障版本的 Service Worker 與靜態快取。</p>
    <p>不會清除登入帳號、日報草稿或系統資料。</p>
    <div id="status">開始復原…</div>
  </main>
  <script>
    (async function(){
      const status=document.getElementById('status');
      try{
        status.textContent='正在解除舊版控制…';
        if('serviceWorker' in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration=>registration.unregister()));
        }
        status.textContent='正在刪除故障快取…';
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.filter(key=>key.indexOf('ds-app-shell-')===0).map(key=>caches.delete(key)));
        }
        status.className='ok';
        status.textContent='復原完成，正在重新開啟工作台…';
        setTimeout(()=>location.replace('./?recovered=409a205b&ts='+Date.now()),700);
      }catch(error){
        status.className='bad';
        status.textContent='自動復原失敗：'+(error&&error.message?error.message:String(error));
      }
    })();
  </script>
</body>
</html>

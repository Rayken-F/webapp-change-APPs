<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101942">
  <title>鼎世工作台｜IQC RC v31</title>
  <style>
    html,body{margin:0;min-height:100%;background:#081331;color:#eaf2ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
    .card{max-width:480px;padding:22px;border:1px solid rgba(130,160,255,.28);border-radius:20px;background:#142459}
    strong{display:block;font-size:20px;margin-bottom:8px}small{color:#aebce5;line-height:1.6}
  </style>
</head>
<body>
  <div class="boot"><div class="card"><strong>IQC RC v31 載入中</strong><small>單張 OCR＋同批累積；IndexedDB 與目前照片不會清除。</small></div></div>
  <script>
  (async function(){
    try{
      const source=await fetch('./v25.html?rc_bootstrap=31-20260826-1',{cache:'no-store'}).then(function(r){
        if(!r.ok)throw new Error('v25 base HTTP '+r.status);
        return r.text();
      });
      let html=source.replace('IQC Hybrid Image RC v25｜測試入口','IQC Hybrid Image RC v31｜單張辨識＋批次累積測試入口');
      const runtimePattern=/<script src="\.\/iqc-intake-runtime-v25\.js[^\"]*"><\/script>/;
      const replacement='<script src="./iqc-single-photo-batch-v31.js?v=20260826-1"><\/script>';
      if(!runtimePattern.test(html))throw new Error('V31 runtime replacement marker not found');
      html=html.replace(runtimePattern,replacement);
      document.open();document.write(html);document.close();
    }catch(err){
      document.body.innerHTML='<div class="boot"><div class="card"><strong>V31 載入失敗</strong><small>'+String(err&&err.message||err)+'</small></div></div>';
    }
  })();
  </script>
</body>
</html>

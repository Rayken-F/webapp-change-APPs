<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101942">
  <title>鼎世工作台｜IQC RC v30</title>
  <style>
    html,body{margin:0;min-height:100%;background:#081331;color:#eaf2ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
    .card{max-width:480px;padding:22px;border:1px solid rgba(130,160,255,.28);border-radius:20px;background:#142459}
    strong{display:block;font-size:20px;margin-bottom:8px}small{color:#aebce5;line-height:1.6}
  </style>
</head>
<body>
  <div class="boot"><div class="card"><strong>IQC RC v30 載入中</strong><small>Hybrid 現場救援版：Local 只跑一次，缺口交給選擇性 Cloud 第二讀者。</small></div></div>
  <script>
  (async function(){
    try{
      const source=await fetch('./v25.html?rc_bootstrap=30-20260826-1',{cache:'no-store'}).then(function(r){
        if(!r.ok)throw new Error('v25 base HTTP '+r.status);
        return r.text();
      });
      let html=source.replace('IQC Hybrid Image RC v25｜測試入口','IQC Hybrid Image RC v30｜Hybrid 現場救援測試入口');
      html=html.replace('<title>鼎世工作台｜Grinding Recovery RC</title>','<title>鼎世工作台｜IQC Hybrid RC v30</title>');
      document.open();document.write(html);document.close();
    }catch(err){
      document.body.innerHTML='<div class="boot"><div class="card"><strong>V30 載入失敗</strong><small>'+String(err&&err.message||err)+'</small></div></div>';
    }
  })();
  </script>
</body>
</html>
